.ltr { direction: ltr !important; text-align: left !important; }

/* ===== page transitions ===== */

.toast { animation: toastIn .25s ease; }

.modal-bg { background: rgba(2,6,15,.78); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

<script>
/* =========================================================
   DARK ZONE v2
   ملاحظة: كل الصلاحيات الحقيقية في Supabase (RLS + RPC)
   — الشروط اللي هنا للواجهة بس.
========================================================= */

/* ===================== SUPABASE ===================== */

const SUPABASE_URL = "https://ywmknardakcpncvhlosy.supabase.co";
const SUPABASE_KEY = "sb_publishable_-eV0eYhMoP9pR_fJnC2tUQ_KrPggVdL";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

/* ===================== STATE ===================== */

const S = {
    user: null,
    me: null,                 // my profile
    settings: {
        closed: false, yClosed: false, tClosed: false, yPrice: 0, tPrice: 0
    },
    subs: [],                 // submissions visible to me
    workers: [],              // owner/supervisor: all workers
    staff: [],                // owner/supervisor: owner + supervisors (for "reviewed by")
    loaded: false,
    hashSupport: null,        // null = unknown, true/false after first try
    submitting: false,
    timers: []
};

const TOOLS = {
    yazeed: {
        key: "yazeed", name: "يزيد", full: "أداة يزيد", icon: "🟣",
        text: "text-purple-500", textSoft: "text-purple-400",
        bg: "bg-purple-500/10", border: "border-purple-500/25",
        solid: "bg-purple-600 hover:bg-purple-700", grad: "from-purple-600 to-indigo-600",
        hex: "#9333ea"
    },
    tayeb: {
        key: "tayeb", name: "الطيب", full: "أداة الطيب", icon: "⚡",
        text: "text-orange-500", textSoft: "text-orange-400",
        bg: "bg-orange-500/10", border: "border-orange-500/25",
        solid: "bg-orange-500 hover:bg-orange-600", grad: "from-orange-500 to-amber-500",
        hex: "#f97316"
    }
};

// رقم النسخة — بيزيد مع كل تحديث. الأونر يقدر يوقف أي نسخة أقدم من min_version
const APP_VERSION = 211;

const MAX_TXT_SIZE = 10 * 1024 * 1024;
const MAX_IMG_SIZE = 20 * 1024 * 1024;
const ALLOWED_IMG_EXT = ["png", "jpg", "jpeg", "webp", "gif"];
const OCR_MAX_FAILS = 3;
const OCR_LOCK_MS = 5 * 60 * 1000;

// السماحية في عدد السطور: 3 سطور أو 5% من الـ Valid (الأكبر فيهم)
function lineTolerance(valid) { return Math.max(3, Math.ceil(valid * 0.05)); }

/* ===================== HELPERS ===================== */

const $ = id => document.getElementById(id);

function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function safeSet(key, v) { try { localStorage.setItem(key, v); } catch (e) { /* ignore */ } }

// أي نص جاي من المستخدم لازم يعدي من هنا قبل innerHTML
function esc(value) {
    if (value === null || value === undefined) return "";
    return String(value)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

// لاستخدام قيمة جوه onclick="fn('...')"
function arg(value) { return esc(encodeURIComponent(String(value ?? ""))); }
function unarg(value) { return decodeURIComponent(String(value ?? "")); }

let lang = safeGet("elbob_language") === "en" ? "en" : "ar";

function money(v) {
    const n = Number(v || 0);
    return (Number.isInteger(n) ? n.toString() : n.toFixed(2)) + (lang === "en" ? " EGP" : " ج.م");
}

function toolOf(row) { return row && row.tool_name === "tayeb" ? "tayeb" : "yazeed"; }
function toolPrice(tool) { return tool === "tayeb" ? S.settings.tPrice : S.settings.yPrice; }
function isToolClosed(tool) { return tool === "tayeb" ? S.settings.tClosed : S.settings.yClosed; }

function hasVal(v) { return v !== null && v !== undefined && v !== ""; }

// مصدر واحد لحساب سعر أي تسليمة
function calcPrice(row) {
    if (!row) return 0;
    if (hasVal(row.total_price)) return Number(row.total_price) || 0;
    const unit = hasVal(row.unit_price) ? Number(row.unit_price) : toolPrice(toolOf(row));
    return Number(row.valid_count || 0) * (Number(unit) || 0);
}

function calcUnit(row) {
    if (hasVal(row.unit_price)) return Number(row.unit_price) || 0;
    const v = Number(row.valid_count || 0);
    if (hasVal(row.total_price) && v) return Number(row.total_price) / v;
    return toolPrice(toolOf(row));
}

const isApprovedUnpaid = s => s.status === "approved" && !isPaid(s);

function friendlyError(error) {
    const msg = error?.message || "";
    const code = error?.code || "";
    if (msg === "Invalid login credentials") return "الإيميل أو الباسورد غلط، أو الحساب لسه ماتأكدش.";
    if (msg.includes("Email not confirmed")) return "لازم تأكد الإيميل الأول من الرسالة اللي وصلتك.";
    if (msg.includes("User already registered")) return "الإيميل ده متسجل قبل كده.";
    if (code === "23505" || msg.includes("duplicate key")) return "❌ الملف ده اتسلّم قبل كده، مينفعش يتسلّم تاني.";
    if (msg.includes("Failed to fetch") || msg.includes("NetworkError")) return "مشكلة في النت، جرّب تاني.";
    return msg || "حصل خطأ، جرّب تاني";
}

function getFileExtension(name) {
    const parts = String(name || "").split(".");
    if (parts.length < 2) return "";
    return parts.pop().toLowerCase().replace(/[^a-z0-9]/g, "");
}

/* ===================== DATES (توقيت القاهرة) ===================== */

// يوم الشغل بيبدأ الساعة 6 الصبح مش 12 بالليل:
// أي تسليمة من 12 بالليل لحد 5:59 الصبح بتتحسب على اليوم اللي قبله
// (مثلاً تسليم الساعة 1 بالليل يوم 15 = شغل يوم 14). غيّر الرقم لو عايز ساعة تانية.
const DAY_START_HOUR = 6;

const DAY_NAMES_AR = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
const DAY_NAMES_EN = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const dayName = i => (lang === "en" ? DAY_NAMES_EN : DAY_NAMES_AR)[i];

function cairoParts(value) {
    const d = value ? new Date(value) : new Date();
    const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Africa/Cairo", year: "numeric", month: "2-digit", day: "2-digit",
        weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23"
    }).formatToParts(d);
    const g = t => parts.find(p => p.type === t)?.value || "";
    const wd = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
    return { y: g("year"), m: g("month"), d: g("day"), h: g("hour"), min: g("minute"), wd: wd[g("weekday")] ?? 0 };
}

function dayKey(value) {
    const t = value ? new Date(value).getTime() : Date.now();
    const p = cairoParts(t - DAY_START_HOUR * 3600e3);
    return `${p.y}-${p.m}-${p.d}`;
}
function todayKey() { return dayKey(); }

function addDays(key, n) {
    const [y, m, d] = key.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
}

function weekdayOfKey(key) {
    const [y, m, d] = key.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
}

function lastFridayKey() {
    const t = todayKey();
    return addDays(t, -((weekdayOfKey(t) - 5 + 7) % 7));
}

function prettyKey(key) {
    if (!key || key === "all") return "";
    const [y, m, d] = key.split("-");
    return `${dayName(weekdayOfKey(key))} ${d}/${m}`;
}

function fmtDate(value) {
    if (!value) return "-";
    const p = cairoParts(value);
    let h = Number(p.h);
    const ampm = lang === "en" ? (h >= 12 ? "PM" : "AM") : (h >= 12 ? "م" : "ص");
    h = h % 12 || 12;
    return `${dayName(p.wd)} ${p.d}/${p.m} — ${h}:${p.min} ${ampm}`;
}

function fmtShortDate(value) {
    const p = cairoParts(value);
    return `${dayName(p.wd)} ${p.d}/${p.m}/${p.y}`;
}

/* ===================== SOUNDS (Web Audio — من غير ملفات) ===================== */

let audioCtx = null;

function getAudio() {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
    } catch (e) { return null; }
}

// المتصفح بيسمح بالصوت بعد أول لمسة — نجهزه من أول تفاعل
["pointerdown", "keydown", "touchstart"].forEach(ev =>
    window.addEventListener(ev, () => getAudio(), { once: true, passive: true }));

function tone(freq, start, dur, type = "sine", vol = 0.18) {
    const ctx = getAudio();
    if (!ctx) return;
    const t0 = ctx.currentTime + start;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
}

function toast(message, type = "info") {
    const c = $("toastContainer");
    if (!c) return;
    const cls = {
        success: "bg-emerald-600 text-white", error: "bg-red-600 text-white",
        warning: "bg-yellow-400 text-black", info: "bg-slate-900 text-white dark:bg-white dark:text-slate-900"

/* ===================== MODALS ===================== */

let modalStack = [];

function openModalHtml(innerHtml, { width = "max-w-md", onClose = null, dismissable = true } = {}) {
    const wrap = document.createElement("div");
    wrap.className = "fixed inset-0 z-[200] modal-bg flex items-center justify-center p-4";
    wrap.innerHTML = `<div class="modal-card w-full ${width} max-h-[92vh] overflow-y-auto rounded-3xl bg-white dark:bg-[#111827] border border-slate-200 dark:border-white/10 p-6 shadow-2xl">${innerHtml}</div>`;
    if (dismissable) {
        wrap.addEventListener("click", e => { if (e.target === wrap) closeTopModal(); });
    }
    $("modalRoot").appendChild(wrap);
    modalStack.push({ el: wrap, onClose, dismissable });
    return wrap;
}

function closeTopModal(force = false) {
    const top = modalStack[modalStack.length - 1];
    if (!top || (!top.dismissable && !force)) return;
    modalStack.pop();
    top.el.remove();
    if (top.onClose) top.onClose();
}

function closeAllModals() {
    while (modalStack.length) closeTopModal(true);
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closeTopModal(); });

/**
 * confirmDialog({ title, text, confirmText, confirmClass, input: {label, placeholder, ltr, textarea}, onConfirm })
 * onConfirm(value) — لو رجّعت false المودال يفضل مفتوح
 */
function confirmDialog(opts) {
    const {
        title, text = "", confirmText = "تأكيد", confirmClass = "bg-red-600 text-white",
        input = null, onConfirm, icon = ""
    } = opts;

    const inputHtml = input ? `
        <div class="mt-4">
            <label class="block text-xs font-bold text-slate-500 mb-1.5">${esc(input.label || "")}</label>
            ${input.textarea
                ? `<textarea id="dlgInput" rows="2" class="input text-sm" placeholder="${esc(input.placeholder || "")}"></textarea>`
                : `<input id="dlgInput" class="input ${input.ltr ? "ltr" : ""}" placeholder="${esc(input.placeholder || "")}">`}
        </div>` : "";

    const m = openModalHtml(`
        ${icon ? `<div class="text-4xl mb-2">${icon}</div>` : ""}
        <h3 class="text-xl font-black">${esc(title)}</h3>
        ${text ? `<p class="text-sm text-slate-500 dark:text-slate-400 mt-3 leading-7" style="white-space:pre-line">${esc(text)}</p>` : ""}
        ${inputHtml}
        <div class="flex gap-3 mt-6">
            <button type="button" data-act="cancel" class="flex-1 py-3 rounded-2xl bg-slate-100 dark:bg-white/10 font-bold">إلغاء</button>
            <button type="button" data-act="ok" class="flex-1 py-3 rounded-2xl font-black ${confirmClass}">${esc(confirmText)}</button>
        </div>`);

    if (input?.value) m.querySelector("#dlgInput").value = input.value;
    if (input) setTimeout(() => m.querySelector("#dlgInput")?.focus(), 60);

    m.querySelector('[data-act="cancel"]').onclick = () => closeTopModal(true);
    const ok = m.querySelector('[data-act="ok"]');
    ok.onclick = async () => {
        ok.disabled = true;
        const value = input ? m.querySelector("#dlgInput").value : undefined;
        let keepOpen = false;
        try {
            const res = await onConfirm?.(value);
            keepOpen = res === false;
        } finally {
            if (keepOpen) ok.disabled = false;
            else if (modalStack.some(x => x.el === m)) {
                modalStack = modalStack.filter(x => x.el !== m);
                m.remove();
            }
        }
    };
}

async function openStorageFile(bucket, encodedPath) {
    try {
        const path = unarg(encodedPath);
        if (!path) throw new Error("الملف غير موجود");
        const fileName = path.split("/").pop() || "download";
        const download = bucket === "work-files";

        const { data, error } = await db.storage.from(bucket)
            .createSignedUrl(path, 600, download ? { download: fileName } : {});
        if (error) throw error;

        if (download) {
            const a = document.createElement("a");
            a.href = data.signedUrl;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();
        } else {
            openImageViewer(data.signedUrl);
        }
    } catch (e) {
        console.error(e);
        toast(friendlyError(e), "error");
    }
}

// مصغرات صور الاتشيكر — طلب واحد لكل الصور
const thumbCache = new Map();

async function loadThumbs(container) {
    const imgs = [...container.querySelectorAll("img[data-proof]")];
    const now = Date.now();
    // الرابط صالح ساعة — بنجدده لو فاضل أقل من 5 دقايق
    const need = [...new Set(imgs.map(i => i.dataset.proof)
        .filter(p => !thumbCache.has(p) || thumbCache.get(p).exp < now + 5 * 60e3))];

    if (need.length) {
        const { data } = await db.storage.from("proofs").createSignedUrls(need, 3600);
        (data || []).forEach(r => { if (r.signedUrl) thumbCache.set(r.path, { url: r.signedUrl, exp: now + 3600e3 }); });
    }
    imgs.forEach(img => {
        const url = thumbCache.get(img.dataset.proof)?.url;
        if (url) {
            img.src = url;
            img.onclick = () => openImageViewer(url);
        }
    });
}

function copyText(text, okMsg = "اتنسخ ✅") {
    const done = () => toast(okMsg, "success");
    if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else fallbackCopy(text, done);
}

function fallbackCopy(text, done) {
    const el = document.createElement("textarea");
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand("copy");
    el.remove();
    done();
}

/* ===================== COUNT-UP NUMBERS ===================== */

function animateNumbers(root) {
    root.querySelectorAll("[data-count]").forEach(el => {
        const target = Number(el.dataset.count) || 0;
        const isMoney = el.dataset.money === "1";
        const dur = 600;
        const start = performance.now();
        const fmt = v => isMoney ? money(Math.round(v * 100) / 100) : Math.round(v).toString();
        if (!target) { el.textContent = fmt(0); return; }
        const step = now => {
            const p = Math.min(1, (now - start) / dur);
            const eased = 1 - Math.pow(1 - p, 3);
            el.textContent = fmt(p < 1 ? target * eased : target);
            if (p < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
    });
}

function countSpan(value, isMoney = false, cls = "") {
    const v = isMoney ? Math.round(Number(value || 0) * 100) / 100 : Number(value || 0);
    return `<span class="num ${cls}" data-count="${v}" data-money="${isMoney ? 1 : 0}">${isMoney ? money(v) : v}</span>`;
}

// Supabase بيرجّع أقصى 1000 صف في الطلب — بنجيب الباقي صفحة صفحة عشان مفيش تسليمة تختفي
async function fetchAll(makeQuery, pageSize = 1000) {
    const all = [];
    for (let from = 0; ; from += pageSize) {
        const { data, error } = await makeQuery().range(from, from + pageSize - 1);
        if (error) return { data: null, error };
        all.push(...(data || []));
        if (!data || data.length < pageSize) return { data: all, error: null };
    }
}

async function loadData() {
    const role = S.me?.role;
    if (!role) return;

    if (role === "worker") {
        const { data, error } = await fetchAll(() => db.from("submissions").select("*")
            .eq("worker_id", S.user.id).order("created_at", { ascending: false }).order("id"));
        if (error) return toast(friendlyError(error), "error");
        S.subs = data || [];
        return;
    }

    const [w, st, s] = await Promise.all([
        db.from("profiles").select("*").eq("role", "worker").order("created_at", { ascending: false }),
        db.from("profiles").select("id, full_name, username, role").in("role", ["owner", "supervisor"]),
        fetchAll(() => db.from("submissions").select("*").order("created_at", { ascending: false }).order("id"))
    ]);
    if (w.error) return toast(friendlyError(w.error), "error");
    if (s.error) return toast(friendlyError(s.error), "error");
    S.workers = w.data || [];
    S.staff = st.data || [];
    S.subs = s.data || [];
}

function saveBrowserPassword(email, password) {
    try {
        if (!window.PasswordCredential || !navigator.credentials?.store || !email || !password) return;
        navigator.credentials.store(new PasswordCredential({ id: email, password, name: S.me?.full_name || email })).catch(() => {});
    } catch (e) { /* مش مدعوم */ }
}

async function login(e) {
    e.preventDefault();
    const btn = $("loginSubmit");
    // المتصفح ساعات بيحط مسافات أو حروف كابيتال أو حروف مخفية مع الإيميل المحفوظ

    setLoading(btn, "جاري الدخول...");
    try {
        const { data, error } = await db.auth.signInWithPassword({ email, password });
        if (error) throw error;
        S.user = data.user;
        try { saveBrowserPassword(email, password); } catch (e) { /* مش هيوقف الدخول */ }
        await enterApp(true);
    } catch (err) {
        console.error(err);
        if (err?.message === "Invalid login credentials") {
            Sound.error();
            $("loginForm").closest(".card")?.classList.remove("shake");
            void $("loginForm").offsetWidth;

        } else {
            toast(friendlyError(err), "error");
        }
    } finally {
        btn.disabled = false;
        btn.textContent = "دخول";
    }
}

const USERNAME_RE = /^[a-zA-Z0-9_.]{3,30}$/;
const CASH_RE = /^01[0125][0-9]{8}$/;

async function register(e) {
    e.preventDefault();
    const full_name = $("regName").value.trim();
    const username = $("regUsername").value.trim();
    const cash_number = $("regCash").value.trim();
    const email = $("regEmail").value.trim();
    const password = $("regPassword").value;

    if (full_name.length < 2 || /[<>]/.test(full_name)) return toast("اكتب اسمك صح (من غير رموز)", "warning");
    if (!USERNAME_RE.test(username)) return toast("اسم المستخدم: حروف إنجليزي وأرقام و _ و . بس (من 3 لـ 30)", "warning");
    if (!CASH_RE.test(cash_number)) return toast("رقم الكاش لازم يكون 11 رقم ويبدأ بـ 010 / 011 / 012 / 015", "warning");

    const btn = $("registerSubmit");

async function loadProfile() {
    const { data, error } = await db.rpc("get_my_profile");
    if (!error && data) {
        const p = Array.isArray(data) ? data[0] : data;
        if (p) { S.me = p; return true; }
    }
    const r = await db.from("profiles").select("*").eq("id", S.user.id).maybeSingle();
    if (r.error) { toast(friendlyError(r.error), "error"); return false; }
    S.me = r.data;
    return !!S.me;
}

async function enterApp(freshLogin = false) {
    const ok = await loadProfile();
    if (!ok || S.me.active === false) {
        if (S.me?.active === false) toast("الحساب ده متعطل من الإدارة.", "error");
        await db.auth.signOut();
        S.user = null; S.me = null;
        showAuthScreen();
        return;
    }

    await Promise.all([loadSettings(), loadData()]);
    S.loaded = true;

    $("authScreen").classList.add("hidden-view");
    $("appShell").classList.remove("hidden-view");

    const roleNames = { owner: "👑 الأونر", supervisor: "🧑‍💼 مشرف", worker: "👷 موظف" };
    $("sideRole").textContent = roleNames[S.me.role] || "";
    $("sideName").textContent = S.me.full_name || "-";
    $("sideUser").textContent = "@" + (S.me.username || "-");
    $("sideAvatar").textContent = (S.me.full_name || "?").trim().charAt(0) || "?";


    try {
        if (S.me.role === "worker") initWorkerNotifications();
        if (S.me.role !== "worker") S.lastPendingCount = S.subs.filter(s => s.status === "pending").length;

        if (!location.hash || !routeAllowed(parseRoute().name)) {
            location.replace("#/" + defaultRoute());
        }
        renderRoute();
    } catch (e) {
        console.error(e);
        toast("حصل خطأ في عرض الصفحة: " + (e?.message || e), "error");
    }
    startPolling();
}

async function checkExistingSession() {
    try {
        const { data, error } = await db.auth.getSession();
        if (error) throw error;
        if (!data.session) return showAuthScreen();
        S.user = data.session.user;
        await enterApp();
    } catch (e) {
        console.error(e);
        showAuthScreen();
    }
}

async function logout(silent = false) {
    stopPolling();
    await db.auth.signOut();
    Object.assign(S, { user: null, me: null, subs: [], workers: [], staff: [], loaded: false });
    thumbCache.clear();

function parseRoute() {
    const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
    return { name: parts[0] || "", param: parts[1] ? decodeURIComponent(parts[1]) : null };
}

function routeAllowed(name) {
    const role = S.me?.role;
    if (role === "owner" && name === "worker") return true;
    return (NAV[role] || []).some(n => n.name === name);
}

function defaultRoute() {
    const role = S.me?.role;
    if (role === "owner") return "home";
    if (role === "worker" && S.settings.yClosed && !S.settings.tClosed) return "tayeb";
    return "yazeed";
}

function go(path) {
    if (location.hash === "#/" + path) renderRoute();
    else location.hash = "#/" + path;
}

window.addEventListener("hashchange", () => { if (S.loaded) renderRoute(); });

function pendingCountFor(tool) {
    return S.subs.filter(s => s.status === "pending" && toolOf(s) === tool).length;
}

function renderNav(active) {
    const items = NAV[S.me.role] || [];
    const accent = (items.find(i => i.name === active) || items[0])?.accent || "#6366f1";
    const badge = it => {
        if (!it.badge) return "";
        const n = pendingCountFor(it.badge);
        return n ? `<span class="nav-badge num">${n}</span>` : "";
    };

    $("sideNav").innerHTML = items.map(it => {
        const isActive = it.name === active || (active === "worker" && it.name === "workers");
        return `<a href="#/${it.name}" class="nav-item ${isActive ? "active" : ""}" style="${isActive ? `background:${it.accent}` : ""}">
            <span class="text-lg">${it.icon}</span><span>${esc(it.label)}</span>${badge(it)}
        </a>`;
    }).join("");

    $("bottomNav").style.setProperty("--accent", accent);
    $("bottomNav").innerHTML = items.map(it => {
        const isActive = it.name === active || (active === "worker" && it.name === "workers");
        return `<a href="#/${it.name}" class="bnav-item ${isActive ? "active" : ""}">
            <span class="ico">${it.icon}</span><span>${esc(it.short)}</span>${badge(it)}
        </a>`;
    }).join("");

    // عدّاد التسليمات المعلقة على اسم التاب
    if (S.me.role !== "worker") {
        const n = S.subs.filter(s => s.status === "pending").length;
        document.title = n ? `(${n}) DARK ZONE` : "DARK ZONE";
    }
}

function renderRoute() {
    if (!S.me) return;
    let { name, param } = parseRoute();
    if (!routeAllowed(name)) {
        location.replace("#/" + defaultRoute());
        return;
    }

    // الموظف والموقع مقفول
    if (S.me.role === "worker" && S.settings.closed) {
        renderNav(name);
        mountPage(maintenanceHtml());
        return;
    }

    const page = PAGES[S.me.role]?.[name];
    if (!page) return;

    renderNav(name);
    mountPage(page.render(param), page.after, param);
    window.scrollTo(0, 0);
}

function mountPage(html, after, param) {
    const root = $("page");
    root.innerHTML = `<div class="page-enter">${html}</div>`;
    animateNumbers(root);
    loadThumbs(root);
    if (after) after(root, param);
}

// تحديث الصفحة بالبيانات الجديدة من غير ما نبوّظ اللي المستخدم بيكتبه
function refreshCurrentPage() {
    if (!S.me) return;
    const { name, param } = parseRoute();
    const page = PAGES[S.me.role]?.[name];

    if (S.me.role === "worker" && S.settings.closed) return renderRoute();

    renderNav(name);
    if (page?.live) {
        page.live(param);
        return;
    }
    const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName);
    if (modalStack.length || typing || page?.noAutoRefresh) return;
    const y = window.scrollY;
    mountPage(page.render(param), page.after, param);
    window.scrollTo(0, y);
}

/* ===================== POLLING ===================== */

function startPolling() {
    stopPolling();
    S.timers.push(setInterval(pollTick, 30000));
}

function stopPolling() {
    S.timers.forEach(clearInterval);
    S.timers = [];
}

async function pollTick() {
    if (!S.me || S.submitting) return;

    // لو الحساب اتعطل وهو فاتح
    const { data: p } = await db.from("profiles").select("active").eq("id", S.user.id).maybeSingle();
    if (p && p.active === false) {
        toast("الحساب ده اتعطل من الإدارة.", "error");
        return logout(true);
    }

    await Promise.all([loadSettings(), loadData()]);

    if (S.me.role === "worker") {
        checkWorkerNotifications();
    } else {
        const n = S.subs.filter(s => s.status === "pending").length;
        if (n > (S.lastPendingCount || 0)) {
            Sound.ping();
            toast(`🔔 وصلت ${n - (S.lastPendingCount || 0)} تسليمة جديدة`, "info");
        }
        S.lastPendingCount = n;
    }
    refreshCurrentPage();
}

// رسم بياني بسيط بالأعمدة (SVG من غير مكتبات)
function barChart(days, series) {
    // series: [{key, color, label, values: [n per day]}]
    const max = Math.max(1, ...days.map((_, i) => sum(series, s => s.values[i])));
    const best = days.map((_, i) => sum(series, s => s.values[i])).indexOf(max);
    const cols = days.map((d, i) => {
        const total = sum(series, s => s.values[i]);
        let stack = "";
        series.forEach(s => {
            const h = (s.values[i] / max) * 100;
            if (h > 0) stack += `<div class="bar w-full" style="height:${h}%;background:${s.color}" title="${esc(s.label)}: ${s.values[i]}"></div>`;
        });
        const isBest = total > 0 && i === best;
        return `
        <div class="flex-1 min-w-0 flex flex-col items-center gap-1">
            <span class="text-[10px] font-black num ${isBest ? "text-emerald-500" : "text-slate-400"}">${total || ""}${isBest ? " 🔥" : ""}</span>
            <div class="w-full max-w-[34px] h-32 md:h-40 flex flex-col-reverse rounded-lg overflow-hidden bg-slate-200/60 dark:bg-white/5">${stack}</div>
            <span class="text-[10px] text-slate-400 font-bold truncate w-full text-center">${d.label}</span>
        </div>`;
    }).join("");
    const legend = series.length > 1 ? `<div class="flex gap-4 mt-3 text-xs font-bold">${series.map(s =>
        `<span class="flex items-center gap-1.5"><i class="w-3 h-3 rounded" style="background:${s.color}"></i>${esc(s.label)}</span>`).join("")}</div>` : "";
    return `<div class="flex items-end gap-1.5 md:gap-2">${cols}</div>${legend}`;
}

function lastNDays(n) {
    const t = todayKey();
    return Array.from({ length: n }, (_, i) => {
        const key = addDays(t, i - n + 1);
        const [, m, d] = key.split("-");
        return { key, label: i === n - 1 ? "النهاردة" : `${Number(d)}/${Number(m)}` };
    });
}

function lockKey() { return "dz_ocr_" + (S.user?.id || ""); }

function getLock() {
    try { return JSON.parse(safeGet(lockKey()) || "{}"); } catch (e) { return {}; }
}

function setLock(v) { safeSet(lockKey(), JSON.stringify(v)); }

function lockRemaining() {
    const l = getLock();
    return l.until && l.until > Date.now() ? l.until - Date.now() : 0;
}

let lockTimer = null;

function updateLockUI() {
    clearInterval(lockTimer);
    const tick = () => {
        const box = $("lockBox");
        const btn = $("submitBtn");
        if (!box || !btn) { clearInterval(lockTimer); return; }
        const left = lockRemaining();
        if (left > 0) {
            const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
            box.innerHTML = `⏳ التسليم متوقف مؤقتاً بسبب أخطاء متكررة<br>راجع شغلك كويس وجرّب بعد <b class="num ltr inline-block">${m}:${String(s).padStart(2, "0")}</b>`;
            box.classList.remove("hidden-view");
            btn.disabled = true;
        } else {
            box.classList.add("hidden-view");
            if (!S.submitting) btn.disabled = false;
            clearInterval(lockTimer);
        }
    };
    tick();
    if (lockRemaining() > 0) lockTimer = setInterval(tick, 1000);
}

function registerOcrFail() {
    const l = getLock();
    const fails = (l.fails || 0) + 1;
    if (fails >= OCR_MAX_FAILS) setLock({ fails: 0, until: Date.now() + OCR_LOCK_MS });
    else setLock({ fails, until: 0 });
}

/* ---------- OCR ---------- */

let ocrWorkerPromise = null;

function getOcrWorker() {
    if (!ocrWorkerPromise) {
        ocrWorkerPromise = Tesseract.createWorker("eng").catch(err => { ocrWorkerPromise = null; throw err; });
    }
    return ocrWorkerPromise;
}

// تجهيز الصورة للـ OCR: تكبير + أبيض وأسود + تباين عالي
// ولو الخلفية غامقة (سكرين دارك مود) بنقلب الألوان — Tesseract بيقرا الكلام الأسود على أبيض أحسن بكتير
async function prepareForOcr(file, { invert = "auto", threshold = false } = {}) {
    const bmp = await createImageBitmap(file);
    const longSide = Math.max(bmp.width, bmp.height);
    const scale = longSide < 1400 ? Math.min(3, 1400 / longSide) : Math.min(1, 2400 / longSide);
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(bmp.width * scale);
    canvas.height = Math.round(bmp.height * scale);
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
    bmp.close?.();

    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = img.data;
    let total = 0, min = 255, max = 0;
    for (let i = 0; i < d.length; i += 4) {
        const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        d[i] = g;
        total += g;
        if (g < min) min = g;
        if (g > max) max = g;
    }
    const dark = total / (d.length / 4) < 128;
    const flip = invert === "auto" ? dark : invert;
    const range = Math.max(1, max - min);
    for (let i = 0; i < d.length; i += 4) {
        let g = ((d[i] - min) / range) * 255;   // نمدّ التباين
        if (flip) g = 255 - g;
        if (threshold) g = g > 150 ? 255 : 0;
        d[i] = d[i + 1] = d[i + 2] = g;
    }
    ctx.putImageData(img, 0, 0);
    return canvas;
}

// بيطلّع كل الأرقام اللي جنب كلمة Valid في النص
function extractValidNumbers(rawText) {
    const numbers = [];
    const lines = rawText.toLowerCase().split("\n")
        .map(line => line
            .replace(/(\d)[,\s.](?=\d{3}\b)/g, "$1")                // 1,200 أو 1 200 → 1200
            .replace(/v[a@4][l1i|!][i1l|!]d/g, "valid")             // VaIid / Va1id → valid
            .replace(/in\s?valid|unverified|non[\s-]?valid/g, "inv"))
        .filter(l => l.trim());

    lines.forEach((line, i) => {
        let m;
        const after = /valid[^a-z0-9]{0,8}([0-9]+)/g;          // Valid: 80
        while ((m = after.exec(line))) numbers.push(parseInt(m[1], 10));
        const before = /([0-9]+)[^a-z0-9]{0,4}valid/g;          // 80 Valid
        while ((m = before.exec(line))) numbers.push(parseInt(m[1], 10));
        // الكلمة لوحدها في سطر والرقم في السطر اللي بعده (شكل الجدول)
        if (/^\W*valid\W*$/.test(line) && lines[i + 1]) {
            const n = lines[i + 1].match(/^\W*([0-9]+)/);
            if (n) numbers.push(parseInt(n[1], 10));
        }
    });
    return numbers;
}

// بيرجع: "match" | "mismatch" | "unreadable"
// بيجرّب كذا طريقة لحد ما يلاقي الرقم — مش بيستسلم من أول قراية
async function checkProofImage(file, valid) {
    let worker;
    try { worker = await getOcrWorker(); }
    catch (e) { console.warn("OCR load error:", e); return "unreadable"; }

    const attempts = [
        () => prepareForOcr(file),                       // تكبير + تباين (+ قلب لو دارك)
        () => prepareForOcr(file, { threshold: true }),  // أبيض وأسود صريح
        () => prepareForOcr(file, { invert: false }),    // من غير قلب، لو الكشف اتلخبط
        () => file                                       // الصورة زي ما هي
    ];

    const seen = [];
    for (const make of attempts) {
        try {
            const input = await make();
            const res = await worker.recognize(input);
            const nums = extractValidNumbers(res?.data?.text || "");
            if (nums.includes(valid)) return "match";
            seen.push(...nums);
        } catch (e) {
            console.warn("OCR attempt failed:", e);
        }
    }
    return seen.length ? "mismatch" : "unreadable";
}

async function sha256(file) {
    try {
        const buf = await file.arrayBuffer();
        const hash = await crypto.subtle.digest("SHA-256", buf);
        return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, "0")).join("");
    } catch (e) { return null; }
}

function isMissingFunction(err) {
    const m = err?.message || "";
    return err?.code === "PGRST202" || m.includes("Could not find the function") || m.includes("does not exist");
}

// بصمة لكل سطر في التكست — بنبعت البصمات بس، مش السطور نفسها
// (بنشيل المسافات وبنخلي الحروف صغيرة، عشان تغيير شكل السطر مايعدّيش)
function normalizeLine(line) { return line.replace(/\s+/g, "").toLowerCase(); }

async function hashLines(text) {
    const lines = [...new Set(text.split(/\r?\n/).map(normalizeLine).filter(Boolean))];
    const enc = new TextEncoder();
    const out = [];
    for (let i = 0; i < lines.length; i += 500) {
        const chunk = await Promise.all(lines.slice(i, i + 500).map(async l => {
            const h = await crypto.subtle.digest("SHA-256", enc.encode(l));
            return [...new Uint8Array(h)].slice(0, 16).map(b => b.toString(16).padStart(2, "0")).join("");
        }));
        out.push(...chunk);
    }
    return out;
}

async function rpcCreateSubmission(base, hashes) {
    const res = await db.rpc("create_submission", {
        ...base, p_work_hash: hashes.work, p_proof_hash: hashes.proof,

    });
    if (res.error && (res.error.message || "").includes("حدّث الصفحة")) setTimeout(forceUpdate, 2500);
    return res;
}

/* ---------- ضغط صورة الاتشيكر قبل الرفع (توفير مساحة) ---------- */

async function compressImage(file, maxSide = 1600, quality = 0.82) {
    try {
        if (file.type === "image/gif" || file.size < 300 * 1024) return file;
        const bmp = await createImageBitmap(file);
        const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(bmp.width * scale);
        canvas.height = Math.round(bmp.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
        bmp.close?.();
        const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", quality));
        if (!blob || blob.size >= file.size) return file;
        return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
    } catch (e) {
        console.warn("compress failed", e);
        return file;
    }
}

/* ---------- SUBMIT ---------- */

async function submitWork(e, tool) {
    e.preventDefault();
    if (S.submitting) return;

    if (lockRemaining() > 0) { updateLockUI(); return; }

    const valid = Number($("validCount").value);
    const locked = Number($("lockedCount").value);
    const workFile = $("workFile").files[0];
    const proofFile = $("proofFile").files[0];

    if (!Number.isInteger(valid) || valid < 0 || !Number.isInteger(locked) || locked < 0) {
        return toast("اكتب أرقام صحيحة في Valid و Locked", "warning");
    }
    if (!workFile) return toast("اختار ملف الـ TXT", "warning");
    if (!proofFile) return toast("اختار صورة الـ Checker", "warning");
    if (workFile.size === 0) return toast("ملف التيكست فاضي!", "warning");
    if (workFile.size > MAX_TXT_SIZE) return toast("ملف TXT كبير جداً (الحد 10 ميجا)", "warning");
    if (getFileExtension(workFile.name) !== "txt") return toast("لازم الملف يكون .txt", "warning");
    if (!proofFile.type.startsWith("image/")) return toast("صورة الـ Checker لازم تكون صورة", "warning");
    if (proofFile.size > MAX_IMG_SIZE) return toast("الصورة كبيرة جداً (الحد 20 ميجا)", "warning");

    S.submitting = true;
    const btn = $("submitBtn");
    const btnHtml = btn.innerHTML;
    const uploaded = [];

    try {
        setLoading(btn, "بنتأكد من حالة الموقع...");
        await loadSettings();
        if (S.settings.closed) { renderRoute(); return toast("الموقع اتقفل دلوقتي", "warning"); }
        if (isToolClosed(tool)) { renderRoute(); return toast(`${TOOLS[tool].full} اتقفلت دلوقتي`, "warning"); }

        // ---- فحص عدد السطور في ملف التكست ----
        setLoading(btn, "بنعدّ سطور الملف...");
        const fileText = await workFile.text();
        const lineHashes = await hashLines(fileText);
        // بنعدّ السطور المختلفة بس — السطر المتكرر جوه الملف بيتحسب مرة واحدة
        // (عشان محدش يكرر سطر ويكتب Valid أكتر)
        const rawLines = fileText.split(/\r?\n/).filter(l => l.trim()).length;
        const lines = lineHashes.length;
        const dupInFile = rawLines - lines;
        if (!lines) { showSubmitError("ملف التكست فاضي", "الملف مافيهوش أي سطور"); return; }

        // القاعدة: الـ Valid مينفعش يكون أكتر من السطور،
        // والسطور مسموح تزيد عن Valid + Locked بفرق صغير بس
        const extra = lineTolerance(valid);
        if (valid > lines) {
            registerOcrFail();
            updateLockUI();
            showSubmitError("الـ Valid أكتر من السطور", dupInFile > 0
                ? `الملف فيه ${rawLines} سطر، منهم ${dupInFile} سطر متكرر\nيعني ${lines} سطر مختلف بس\nوإنت كاتب Valid ${valid}\n\nشيل السطور المتكررة أو صلّح الرقم`
                : `الملف فيه ${lines} سطر\nوإنت كاتب Valid ${valid}\n\nالـ Valid مينفعش يكون أكتر من عدد السطور`);
            return;
        }
        if (lines > valid + locked + extra) {
            registerOcrFail();
            updateLockUI();
            showSubmitError("عدد السطور مش مظبوط",
                `الملف فيه ${lines} سطر\nوإنت كاتب Valid ${valid} و Locked ${locked}\n\nأقصى عدد سطور مسموح: ${valid + locked + extra}`);
            return;
        }

        setLoading(btn, "الـ AI بيراجع الصورة...");
        const verdict = await checkProofImage(proofFile, valid);

        if (verdict === "mismatch") {
            registerOcrFail();
            showSubmitError("الرقم في الصورة مختلف",
                `الـ Valid اللي في صورة الاتشيكر مش ${valid}\nبرجاء التأكد من الرقم اللي كتبته وجرّب تاني`);
            return;
        }
        // لو الـ AI مقدرش يقرا الصورة مابنوقفش الموظف — التسليمة بتروح للمراجعة اليدوية عادي
        if (verdict === "unreadable") toast("📷 الـ AI مقدرش يقرا الرقم من الصورة — الإدارة هتراجعها بنفسها", "info");
        setLock({ fails: 0, until: 0 });

        setLoading(btn, "جاري رفع التسليمة...");
        const [workHash, proofHash] = await Promise.all([sha256(workFile), sha256(proofFile)]);

        const id = crypto.randomUUID();
        const uploadProof = await compressImage(proofFile);
        let ext = uploadProof === proofFile ? getFileExtension(proofFile.name) : "jpg";
        if (!ALLOWED_IMG_EXT.includes(ext)) ext = "png";
        const workPath = `${S.user.id}/${id}.txt`;
        const proofPath = `${S.user.id}/${id}.${ext}`;

        const up1 = await db.storage.from("work-files").upload(workPath, workFile, { contentType: "text/plain", upsert: false });
        if (up1.error) throw up1.error;
        uploaded.push(["work-files", workPath]);

        const up2 = await db.storage.from("proofs").upload(proofPath, uploadProof, { contentType: uploadProof.type, upsert: false });
        if (up2.error) throw up2.error;
        uploaded.push(["proofs", proofPath]);

        const { error } = await rpcCreateSubmission({
            p_valid_count: valid, p_locked_count: locked,
            p_work_file: workPath, p_proof_image: proofPath, p_tool_name: tool
        }, { work: workHash, proof: proofHash, lines: lineHashes });
        if (error) throw error;

        uploaded.length = 0;
        $("submitForm").reset();
        clearProof();
        showSubmitSuccess(tool, valid);

        await loadData();
        rememberSeen();
        workerToolLive(tool);
    } catch (err) {
        console.error(err);
        showSubmitError("التسليمة ماتبعتتش", friendlyError(err));
    } finally {
        for (const [bucket, path] of uploaded) db.storage.from(bucket).remove([path]).catch(() => {});
        S.submitting = false;
        if ($("submitBtn")) {
            $("submitBtn").disabled = false;
            $("submitBtn").innerHTML = btnHtml;
        }
        updateLockUI();
    }
}

function seenKey() { return "dz_seen_" + (S.user?.id || ""); }

function snapshot() {
    const m = {};
    S.subs.forEach(s => { m[s.id] = s.status + "|" + (isPaid(s) ? "p" : "u"); });
    return m;
}

function rememberSeen() { safeSet(seenKey(), JSON.stringify(snapshot())); }

function initWorkerNotifications() {
    if (!safeGet(seenKey())) { rememberSeen(); return; } // أول مرة على النسخة الجديدة
    setTimeout(checkWorkerNotifications, 600);
}

function checkWorkerNotifications() {
    let prev = {};
    try { prev = JSON.parse(safeGet(seenKey()) || "{}"); } catch (e) { prev = {}; }

    const approved = [], rejected = [], paid = [];
    S.subs.forEach(s => {
        const before = prev[s.id];
        const [pStatus, pPay] = (before || "").split("|");
        if (s.status === "approved" && pStatus !== "approved" && !isPaid(s)) approved.push(s);
        if (s.status === "rejected" && pStatus && pStatus !== "rejected") rejected.push(s);
        if (isPaid(s) && pPay !== "p") paid.push(s);
    });
    rememberSeen();

    if (!approved.length && !rejected.length && !paid.length) return;

    let body = "";
    if (paid.length) {
        Sound.money();
        confetti(120);
        body += `
        <div class="rounded-2xl bg-emerald-500/10 border border-emerald-500/30 p-4">
            <p class="text-3xl mb-1">💸</p>
            <p class="font-black text-lg text-emerald-500">اتدفعلك ${money(sum(paid, calcPrice))}</p>
            <p class="text-xs text-slate-500 mt-1">${paid.length} تسليمة اتنقلت للأرشيف — تفاصيلها في "مستحقاتي"</p>
        </div>`;
    } else if (approved.length) {
        Sound.celebrate();
        confetti();
    } else {
        Sound.soft();
    }

    if (approved.length) {
        const byTool = ["yazeed", "tayeb"].map(t => {
            const rows = approved.filter(s => toolOf(s) === t);
            return rows.length ? `<div class="rounded-xl ${TOOLS[t].bg} px-3 py-2 flex justify-between font-bold text-sm"><span>${TOOLS[t].icon} ${TOOLS[t].name} (${rows.length})</span><span class="num">+${money(sum(rows, calcPrice))}</span></div>` : "";
        }).join("");
        body += `
        <div class="rounded-2xl bg-sky-500/10 border border-sky-500/30 p-4">
            <p class="text-3xl mb-1">🎉</p>
            <p class="font-black text-lg">${approved.length === 1 ? "تسليمتك اتقبلت!" : `${approved.length} تسليمات اتقبلت!`}</p>
            <p class="text-sky-500 font-black text-xl num mt-1">+${money(sum(approved, calcPrice))}</p>
            <p class="text-xs text-slate-500 mb-3">اتضافوا لمستحقاتك</p>
            <div class="space-y-1.5">${byTool}</div>
        </div>`;
    }

    if (rejected.length) {
        body += `
        <div class="rounded-2xl bg-red-500/5 border border-red-500/20 p-4 text-start">
            <p class="font-black text-red-500 mb-2">${rejected.length === 1 ? "تسليمة اترفضت" : `${rejected.length} تسليمات اترفضت`}</p>
            ${rejected.map(s => `<div class="text-sm py-1.5 border-t border-red-500/10">
                ${TOOLS[toolOf(s)].icon} ${fmtDate(s.created_at)} — Valid ${Number(s.valid_count || 0)}
                ${s.owner_note ? `<br><span class="text-xs text-slate-500">السبب: <b>${esc(s.owner_note)}</b></span>` : ""}
            </div>`).join("")}
        </div>`;
    }

    openModalHtml(`
        <div class="text-center space-y-3">
            <h3 class="text-xl font-black mb-2">في جديد ليك 🔔</h3>
            ${body}
            <button type="button" onclick="closeTopModal(true)" class="w-full mt-3 py-3.5 rounded-2xl bg-black text-white dark:bg-white dark:text-black font-black">تمام 👍</button>
        </div>`);
}

function groupPaymentBatches(rows) {
    const map = new Map();
    rows.filter(isPaid).forEach(s => {
        const key = s.paid_at ? new Date(s.paid_at).toISOString().slice(0, 19) : "unknown";
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(s);
    });
    return [...map.entries()]
        .map(([key, items]) => ({ key, paidAt: items[0].paid_at, items, total: sum(items, calcPrice) }))
        .sort((a, b) => new Date(b.paidAt || 0) - new Date(a.paidAt || 0));
}

function reviewSub(idEnc, status) {
    const id = unarg(idEnc);
    const row = S.subs.find(s => s.id === id);
    if (!row) return;
    if (row.status !== "pending") return toast("التسليمة دي اتراجعت قبل كده", "warning");

    const who = profileName(row.worker_id);
    const info = `${who} — ${TOOLS[toolOf(row)].name} — Valid ${Number(row.valid_count || 0)} (${money(calcPrice(row))})`;

    if (status === "approved") {
        confirmDialog({
            title: "قبول التسليمة", text: info, icon: "✅",
            confirmText: "قبول ✅", confirmClass: "bg-emerald-600 text-white",
            onConfirm: () => doReview(id, "approved", null)
        });
    } else {
        confirmDialog({
            title: "رفض التسليمة", text: info, icon: "❌",
            confirmText: "رفض ❌", confirmClass: "bg-red-600 text-white",
            input: { label: "سبب الرفض (هيظهر للموظف):", placeholder: "مثلاً: الصورة مش مطابقة للملف", textarea: true },
            onConfirm: note => doReview(id, "rejected", note)

async function doReview(id, status, note) {
    const { error } = await db.rpc("review_submission", {
        p_submission_id: id, p_status: status,
        p_note: note && note.trim() ? note.trim().slice(0, 500) : null
    });
    if (error) { toast(friendlyError(error), "error"); return; }
    toast(status === "approved" ? "تم القبول ✅" : "تم الرفض ❌", "success");
    await reloadAndRefresh();
}

function approveAll(tool) {
    const rows = S.subs.filter(s => s.status === "pending" && (tool === "all" || toolOf(s) === tool));
    if (!rows.length) return toast("مفيش تسليمات معلقة", "info");

    confirmDialog({
        title: "قبول كل المعلق", icon: "✅",
        text: `هتقبل ${rows.length} تسليمة${tool !== "all" ? " على " + TOOLS[tool].name : ""}\nبإجمالي ${money(sum(rows, calcPrice))}`,
        confirmText: `قبول الكل (${rows.length})`, confirmClass: "bg-emerald-600 text-white",

/* ---------- ZIP لملفات يوم ---------- */

async function downloadZip(rows, name) {
    rows = rows.filter(r => r.work_file);
    if (!rows.length) return toast("مفيش ملفات TXT", "warning");
    toast(`جاري تجميع ${rows.length} ملف...`, "info");
    const zip = new JSZip();
    const folder = zip.folder(name);
    let ok = 0, fail = 0;
    const queue = [...rows];
    const worker = async () => {
        while (queue.length) {
            const r = queue.shift();
            try {
                const { data, error } = await db.storage.from("work-files").createSignedUrl(r.work_file, 120);
                if (error) throw error;
                const res = await fetch(data.signedUrl);
                if (!res.ok) throw new Error(res.status);
                const w = workerById(r.worker_id);
                const who = (w?.username || "worker").replace(/[^\w.-]/g, "_");
                folder.file(`${who}_${TOOLS[toolOf(r)].key}_${r.work_file.split("/").pop()}`, await res.blob());
                ok++;
            } catch (e) { fail++; console.error(e); }
        }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
    if (!ok) return toast("فشل تحميل الملفات", "error");
    const blob = await zip.generateAsync({ type: "blob" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name + ".zip";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast(fail ? `اتحمل ${ok} و ${fail} فشلوا` : `✅ اتحمل ${ok} ملف`, fail ? "warning" : "success");
}

/* =========================================================
   OWNER — تسجيل بصمات التسليمات القديمة (مرة واحدة)
========================================================= */

function backfillCandidates() {
    if (!S.subs.length || !("lines_registered" in S.subs[0])) return []; // ملف الـ SQL لسه ماتشغلش
    return S.subs
        .filter(s => s.lines_registered === false && s.status !== "rejected" && s.work_file)
        .sort((a, b) => new Date(a.created_at) - new Date(b.created_at)); // الأقدم الأول
}

function backfillBannerHtml() {
    const n = backfillCandidates().length;
    if (!n) return "";
    return `
    <div class="rounded-3xl border border-sky-500/30 bg-sky-500/10 p-5 mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
            <p class="font-black text-sky-600 dark:text-sky-400">🛡️ خطوة مهمة مرة واحدة بس</p>
            <p class="text-sm text-slate-600 dark:text-slate-300 mt-1">فيه <b class="num">${n}</b> تسليمة قديمة لسه سطورها مش متسجلة — يعني ممكن حد يرجع يسلّم نفس السطور تاني.<br>اضغط الزرار وسيب الصفحة مفتوحة لحد ما يخلص.</p>
        </div>
        <button type="button" id="backfillBtn" onclick="runBackfill()" class="px-5 py-3 rounded-2xl bg-sky-600 hover:bg-sky-700 text-white font-black shrink-0">🛡️ سجّل التسليمات القديمة</button>
    </div>`;
}

async function runBackfill() {
    const list = backfillCandidates();
    if (!list.length) return;
    const btn = $("backfillBtn");
    S.backfilling = true;
    const found = [];
    let done = 0, failed = 0;

    for (const row of list) {
        if (btn) btn.innerHTML = `<span class="inline-flex items-center gap-2"><span class="loader"></span>${done}/${list.length}</span>`;
        try {
            const { data, error } = await db.storage.from("work-files").createSignedUrl(row.work_file, 120);
            if (error) throw error;
            const res = await fetch(data.signedUrl);
            if (!res.ok) throw new Error(res.status);
            const hashes = await hashLines(await res.text());
            const r = await db.rpc("admin_register_lines", { p_submission_id: row.id, p_line_hashes: hashes });
            if (r.error) throw r.error;
            if (r.data > 0) found.push({ row, dup: r.data, total: hashes.length });
        } catch (e) {
            failed++;
            console.error("backfill", row.id, e);
        }
        done++;
    }
    S.backfilling = false;
    await reloadAndRefresh();

    openModalHtml(`
        <div class="text-center">
            <div class="text-4xl mb-2">🛡️</div>
            <h3 class="text-xl font-black">خلصنا!</h3>
            <p class="text-sm text-slate-500 mt-2">اتسجلت ${done - failed} تسليمة${failed ? ` — و ${failed} ماتقرتش (ممكن ملفها اتمسح)` : ""}.<br>من دلوقتي أي سطر فيهم مش هيتقبل تاني.</p>
        </div>
        ${found.length ? `
        <div class="mt-5">
            <p class="font-black text-red-500 mb-2">⚠️ لقينا تسليمات قديمة فيها سطور متكررة:</p>
            <div class="space-y-2 max-h-72 overflow-y-auto">${found.map(f => `
                <div class="rounded-xl bg-red-500/5 border border-red-500/20 px-3 py-2 flex items-center justify-between gap-2 text-sm">
                    <div>${workerLink(f.row.worker_id)}<p class="text-[11px] text-slate-500">${fmtDate(f.row.created_at)} · ${TOOLS[toolOf(f.row)].name}</p></div>
                    <b class="text-red-500 num">${f.dup} من ${f.total} سطر</b>
                </div>`).join("")}</div>
            <p class="text-[11px] text-slate-500 mt-2">السطور دي كانت اتسلّمت في تسليمة أقدم. راجعهم لو تحب.</p>
        </div>` : `<p class="text-center text-emerald-500 font-black mt-4">✅ مالقيناش أي سطور متكررة في الشغل القديم</p>`}
        <button type="button" onclick="closeTopModal(true)" class="w-full mt-5 py-3 rounded-2xl bg-black text-white dark:bg-white dark:text-black font-black">تمام</button>`, { width: "max-w-lg" });
}

function ledgerHtml(tool) {
    const v = S.toolView[tool];
    const rows = ledgerRows(tool);
    const chip = (val, label) => `<button type="button" onclick="setLedger('${tool}','filter','${val}')" class="chip ${v.filter === val ? "chip-active" : "chip-idle"}">${label}</button>`;
    const shown = rows.slice(0, 150);

    return `
    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3 mb-4">
        <div class="flex flex-wrap gap-2">
            ${chip("all", "الكل")}${chip("pending", "⏳ معلق")}${chip("due", "🧾 قيد الحساب")}${chip("paid", "💵 مدفوع")}${chip("rejected", "❌ مرفوض")}
        </div>
        <div class="flex flex-wrap items-center gap-2">
            <input type="date" value="${esc(v.date)}" onchange="setLedger('${tool}','date',this.value)" class="input ltr !w-auto !py-2 text-sm">
            ${v.date ? `<button type="button" onclick="setLedger('${tool}','date','')" class="px-3 py-2 rounded-xl bg-red-500/10 text-red-500 font-bold text-sm">✖</button>` : ""}
            ${isOwner() ? `<button type="button" onclick="zipToolDay('${tool}')" class="px-4 py-2 rounded-xl bg-slate-900 text-white dark:bg-white dark:text-black font-black text-sm">📦 ZIP ${v.date ? "اليوم ده" : ""}</button>` : ""}
        </div>
    </div>
    <div class="flex gap-4 text-sm mb-3 text-slate-500">
        <span>${rows.length} تسليمة</span>
        <span>Valid <b class="num text-emerald-500">${sum(rows.filter(r => r.status !== "rejected"), r => Number(r.valid_count || 0))}</b></span>
        <span>المبلغ <b class="num">${money(sum(rows.filter(r => r.status !== "rejected"), calcPrice))}</b></span>
    </div>
    ${!rows.length ? emptyBox("مفيش تسليمات بالفلتر ده") : `
    <div class="overflow-x-auto rounded-2xl border border-slate-200 dark:border-white/10">
        <table class="dz-table w-full">
            <thead class="bg-slate-50 dark:bg-white/[.03]"><tr>
                <th>الموظف</th><th>التاريخ</th><th>Valid</th><th>Locked</th><th>المبلغ</th><th>الحالة</th><th>الملفات</th>${isOwner() ? "<th></th>" : ""}
            </tr></thead>
            <tbody>${shown.map(r => `<tr>
                <td>${workerLink(r.worker_id)}${reviewedByLine(r)}</td>
                <td class="text-xs text-slate-500">${fmtDate(r.created_at)}</td>
                <td class="font-black text-emerald-500 num">${Number(r.valid_count || 0)}</td>
                <td class="font-black text-yellow-500 num">${Number(r.locked_count || 0)}</td>
                <td class="font-black num">${money(calcPrice(r))}</td>
                <td><div class="flex gap-1">${statusBadge(r)}${payBadge(r)}</div></td>
                <td><div class="flex gap-1">${fileButtons(r)}</div></td>
                ${isOwner() ? `<td><div class="flex gap-1">
                    ${r.status === "pending" ? `<button type="button" onclick="reviewSub('${arg(r.id)}','approved')" class="px-2 py-1 rounded-lg bg-emerald-600 text-white text-xs font-black">✅</button><button type="button" onclick="reviewSub('${arg(r.id)}','rejected')" class="px-2 py-1 rounded-lg bg-red-600 text-white text-xs font-black">❌</button>` : ""}
                    <button type="button" onclick="deleteSub('${arg(r.id)}')" class="px-2 py-1 rounded-lg bg-red-500/10 text-red-500 text-xs font-black" title="حذف">🗑️</button>
                </div></td>` : ""}
            </tr>`).join("")}</tbody>
        </table>
    </div>
    ${rows.length > shown.length ? `<p class="text-center text-xs text-slate-500 mt-3">بيظهر أول ${shown.length} — استخدم فلتر التاريخ عشان توصل للباقي</p>` : ""}`}`;
}

function zipToolDay(tool) {
    const v = S.toolView[tool];
    if (!v.date) return toast("اختار يوم من التاريخ الأول", "warning");
    downloadZip(ledgerRows(tool), `${TOOLS[tool].key}_${v.date}`);
}

function toolDuesTableHtml(tool) {
    const due = S.subs.filter(s => isApprovedUnpaid(s) && toolOf(s) === tool);
    const byWorker = new Map();
    due.forEach(s => {
        if (!byWorker.has(s.worker_id)) byWorker.set(s.worker_id, []);
        byWorker.get(s.worker_id).push(s);
    });
    const list = [...byWorker.entries()].map(([id, rows]) => ({ id, rows, total: sum(rows, calcPrice) }))
        .sort((a, b) => b.total - a.total);
    if (!list.length) return emptyBox("مفيش مستحقات على الأداة دي دلوقتي 👌", "🧾");

    return `
    <div class="overflow-x-auto rounded-2xl border border-slate-200 dark:border-white/10">
        <table class="dz-table w-full">
            <thead class="bg-slate-50 dark:bg-white/[.03]"><tr><th>الموظف</th><th>رقم الكاش</th><th>تسليمات</th><th>Valid</th><th>المستحق</th><th></th></tr></thead>
            <tbody>${list.map(x => {
                const w = workerById(x.id);
                return `<tr>
                    <td>${workerLink(x.id)}</td>
                    <td><button type="button" onclick="copyText(unarg('${arg(w?.cash_number || "")}'),'اتنسخ رقم الكاش 📋')" class="font-bold ltr hover:text-indigo-500" title="نسخ">${esc(w?.cash_number || "-")} 📋</button></td>
                    <td class="num">${x.rows.length}</td>
                    <td class="font-black text-emerald-500 num">${sum(x.rows, r => Number(r.valid_count || 0))}</td>
                    <td class="font-black num">${money(x.total)}</td>
                    <td><button type="button" onclick="payWorkerTool('${arg(x.id)}','${tool}')" class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black">💵 دفع ${TOOLS[tool].name}</button></td>
                </tr>`;
            }).join("")}</tbody>
            <tfoot><tr><td class="font-black">الإجمالي</td><td></td><td class="num font-black">${due.length}</td>
                <td class="font-black text-emerald-500 num">${sum(due, r => Number(r.valid_count || 0))}</td>
                <td class="font-black num">${money(sum(due, calcPrice))}</td><td></td></tr></tfoot>
        </table>
    </div>`;
}

function renderToolPage(tool) {
    const t = TOOLS[tool];
    const closed = isToolClosed(tool);
    const pending = S.subs.filter(s => s.status === "pending" && toolOf(s) === tool);
    const due = S.subs.filter(s => isApprovedUnpaid(s) && toolOf(s) === tool);
    const weekAgo = Date.now() - 7 * 86400e3;
    const paidWeek = S.subs.filter(s => toolOf(s) === tool && isPaid(s) && s.paid_at && new Date(s.paid_at).getTime() > weekAgo);

    const controls = isOwner() ? `
        <div class="mt-5 flex flex-wrap items-center gap-2">
            <div class="flex items-center gap-2 bg-white/15 rounded-2xl px-3 py-2">
                <span class="font-bold text-sm">سعر الـ Valid:</span>
                <input id="priceInput" type="number" step="0.01" min="0" value="${toolPrice(tool)}" class="w-20 bg-white/20 rounded-lg px-2 py-1 text-center font-black outline-none ltr">
                <span class="text-sm">ج.م</span>
                <button type="button" onclick="saveToolPrice('${tool}')" class="px-3 py-1.5 rounded-xl bg-white text-slate-900 font-black text-xs">حفظ</button>
            </div>
            <button type="button" onclick="toggleTool('${tool}')" class="px-4 py-2.5 rounded-2xl font-black text-sm ${closed ? "bg-red-500 text-white" : "bg-white/15"}">
                ${closed ? "🔒 مقفولة — افتحها" : "🟢 شغالة — اقفلها"}</button>
        </div>` : `
        <div class="mt-4 inline-flex items-center gap-2 px-4 py-2 rounded-2xl bg-white/15 font-black text-sm">
            ${closed ? "🔒 الأداة مقفولة حالياً" : "🟢 الأداة شغالة"} · السعر ${money(toolPrice(tool))}
        </div>`;

    return `
    <div class="rounded-3xl p-6 md:p-8 mb-6 text-white bg-gradient-to-br ${t.grad} shadow-xl relative overflow-hidden">
        <div class="absolute -left-6 -top-6 text-[120px] opacity-15 leading-none select-none">${t.icon}</div>
        <p class="text-white/80 font-bold">${isOwner() ? "داش بورد" : "مراجعة"}</p>
        <h1 class="text-3xl md:text-4xl font-black mt-1">${t.full}</h1>
        ${controls}
    </div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-6">
        ${statCard({ label: "مستنية مراجعة", value: pending.length, tone: "yellow", icon: "⏳" })}
        ${statCard({ label: "مستحقات (قيد الحساب)", value: sum(due, calcPrice), money: true, tone: tool === "tayeb" ? "orange" : "purple", icon: "🧾" })}
        ${statCard({ label: "Valid قيد الحساب", value: sum(due, s => Number(s.valid_count || 0)), tone: "sky", icon: "✅" })}
        ${statCard({ label: "اتدفع آخر 7 أيام", value: sum(paidWeek, calcPrice), money: true, tone: "emerald", icon: "💸" })}
    </div>

    <div class="card p-5 md:p-6 mb-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-4">
            <h3 class="text-lg font-black">⏳ طابور المراجعة <span class="text-yellow-500 num">(${pending.length})</span></h3>
            ${pending.length ? `<button type="button" onclick="approveAll('${tool}')" class="px-4 py-2.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm">✅ قبول كل المعلق (${pending.length})</button>` : ""}
        </div>
        ${pendingListHtml(pending, { showTool: false })}
    </div>

    ${isOwner() ? `
    <div class="card p-5 md:p-6 mb-6">
        <h3 class="text-lg font-black mb-1">🧾 مستحقات كل موظف على ${t.name}</h3>
        <p class="text-xs text-slate-500 mb-4">تقدر تدفع لموظف ${t.name} بس وتسيب الأداة التانية لوقت تاني</p>
        ${toolDuesTableHtml(tool)}
    </div>` : ""}

    <div class="card p-5 md:p-6">
        <h3 class="text-lg font-black mb-4">📒 كشف حساب ${t.name}</h3>
        <div id="ledgerBox">${ledgerHtml(tool)}</div>
    </div>`;
}

PAGES.owner.yazeed = { render: () => renderToolPage("yazeed") };
PAGES.owner.tayeb = { render: () => renderToolPage("tayeb") };
PAGES.supervisor.yazeed = { render: () => renderToolPage("yazeed") };
PAGES.supervisor.tayeb = { render: () => renderToolPage("tayeb") };

/* =========================================================
   OWNER — 👥 الموظفين
========================================================= */

S.workerSearch = "";

function setWorkerSearch(v) {
    S.workerSearch = v;
    const box = $("workersGrid");
    if (box) box.innerHTML = workersGridHtml();
}

function workersGridHtml() {
    const q = S.workerSearch.toLowerCase().trim();
    const list = S.workers.filter(w => !q || (w.full_name || "").toLowerCase().includes(q) || (w.username || "").toLowerCase().includes(q) || (w.cash_number || "").includes(q));
    if (!list.length) return `<div class="md:col-span-2 xl:col-span-3">${emptyBox("مفيش موظفين مطابقين 😢", "👥")}</div>`;

    return list.map(w => {
        const subs = S.subs.filter(s => s.worker_id === w.id);
        const dy = sum(subs.filter(s => isApprovedUnpaid(s) && toolOf(s) === "yazeed"), calcPrice);
        const dt = sum(subs.filter(s => isApprovedUnpaid(s) && toolOf(s) === "tayeb"), calcPrice);
        const pend = subs.filter(s => s.status === "pending").length;
        return `
        <a href="#/worker/${arg(w.id)}" class="card p-5 block hover:-translate-y-0.5 transition">
            <div class="flex items-start justify-between gap-3">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-12 h-12 shrink-0 rounded-2xl bg-black dark:bg-white text-white dark:text-black flex items-center justify-center font-black text-xl">${esc((w.full_name || "?").charAt(0))}</div>
                    <div class="min-w-0">
                        <p class="font-black truncate">${esc(w.full_name || "-")}</p>
                        <p class="text-xs text-slate-500 ltr truncate">@${esc(w.username || "-")}</p>
                    </div>
                </div>
                ${w.active ? `<span class="px-2 py-1 rounded-full bg-emerald-500/10 text-emerald-500 text-[11px] font-black">نشط</span>` : `<span class="px-2 py-1 rounded-full bg-red-500/10 text-red-500 text-[11px] font-black">معطل</span>`}
            </div>
            <div class="grid grid-cols-3 gap-2 mt-4 text-center">
                <div class="rounded-xl bg-purple-500/10 py-2"><p class="text-[10px] text-slate-500">🟣 يزيد</p><p class="font-black text-purple-500 text-sm num">${money(dy)}</p></div>
                <div class="rounded-xl bg-orange-500/10 py-2"><p class="text-[10px] text-slate-500">⚡ الطيب</p><p class="font-black text-orange-500 text-sm num">${money(dt)}</p></div>
                <div class="rounded-xl bg-yellow-500/10 py-2"><p class="text-[10px] text-slate-500">⏳ معلق</p><p class="font-black text-yellow-500 text-sm num">${pend}</p></div>
            </div>
        </a>`;
    }).join("");
}

function renderWorkers() {
    return `
    ${pageHeader("👥 الموظفين", `${S.workers.length} موظف — ${S.workers.filter(w => w.active).length} نشط`)}
    <input type="text" value="${esc(S.workerSearch)}" oninput="setWorkerSearch(this.value)" placeholder="🔍 ابحث بالاسم أو اليوزر أو رقم الكاش..." class="input mb-5 md:!w-1/2">
    <div id="workersGrid" class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${workersGridHtml()}</div>`;
}

PAGES.owner.workers = {
    render: renderWorkers,
    live: () => { const box = $("workersGrid"); if (box) box.innerHTML = workersGridHtml(); }
};

   OWNER — 👤 صفحة موظف
========================================================= */

S.wdTab = "yazeed";

function setWdTab(tab, idEnc) {
    S.wdTab = tab;
    const box = $("wdBody");
    if (box) { box.innerHTML = wdBodyHtml(unarg(idEnc)); loadThumbs(box); }
    document.querySelectorAll("[data-wdtab]").forEach(b => b.className = "chip " + (b.dataset.wdtab === tab ? "chip-active" : "chip-idle"));
}

function wdRow(r) {
    const id = arg(r.id);
    return `
    <div class="card p-4 flex gap-4">
        ${r.proof_image ? `<img data-proof="${esc(r.proof_image)}" class="thumb shrink-0" alt="">` : ""}
        <div class="flex-1 min-w-0">
            <div class="flex flex-wrap items-center gap-2">${statusBadge(r)} ${payBadge(r)} ${toolBadge(r)}</div>
            <p class="text-xs text-slate-500 mt-1">${fmtDate(r.created_at)}${r.paid_at ? ` · 💵 اتدفع ${fmtDate(r.paid_at)}` : ""}</p>
            ${reviewedByLine(r)}
            <div class="flex flex-wrap gap-x-4 mt-2 text-sm">
                <span>Valid <b class="text-emerald-500 num">${Number(r.valid_count || 0)}</b></span>
                <span>Locked <b class="text-yellow-500 num">${Number(r.locked_count || 0)}</b></span>
                <span>السعر <b class="num">${money(calcUnit(r))}</b></span>
                <span>المبلغ <b class="num">${money(calcPrice(r))}</b></span>
            </div>
            ${r.owner_note ? `<p class="text-xs mt-2 text-slate-500">ملاحظة: <b>${esc(r.owner_note)}</b></p>` : ""}
            <div class="flex flex-wrap gap-2 mt-3">
                ${r.status === "pending" ? `<button type="button" onclick="reviewSub('${id}','approved')" class="px-3 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-black">✅ قبول</button>
                    <button type="button" onclick="reviewSub('${id}','rejected')" class="px-3 py-1.5 rounded-xl bg-red-600 text-white text-xs font-black">❌ رفض</button>` : ""}
                ${isApprovedUnpaid(r) ? `<button type="button" onclick="paySingle('${id}')" class="px-3 py-1.5 rounded-xl bg-sky-600 text-white text-xs font-black">💵 دفع دي</button>` : ""}
                ${fileButtons(r)}
                <button type="button" onclick="deleteSub('${id}')" class="px-3 py-1.5 rounded-xl bg-red-500/10 text-red-500 text-xs font-black">🗑️</button>
            </div>
        </div>
    </div>`;
}

function wdBodyHtml(workerId) {
    const subs = S.subs.filter(s => s.worker_id === workerId);
    if (S.wdTab === "paid") {
        const batches = groupPaymentBatches(subs);
        if (!batches.length) return emptyBox("مفيش مدفوعات للموظف ده لسه");
        return `<div class="space-y-3">${batches.map((b, i) => `
            <details class="card overflow-hidden">
                <summary class="list-none cursor-pointer p-4 flex items-center justify-between gap-3">
                    <div><p class="font-black">✅ دفعة ${b.paidAt ? fmtShortDate(b.paidAt) : ""}</p><p class="text-xs text-slate-500">${b.items.length} تسليمة</p></div>
                    <span class="font-black text-emerald-500 num text-lg">${money(b.total)}</span>
                </summary>
                <div class="px-4 pb-4 space-y-3">${b.items.map(wdRow).join("")}</div>
            </details>`).join("")}</div>`;
    }
    let rows = subs.filter(s => !isPaid(s));
    if (S.wdTab === "yazeed" || S.wdTab === "tayeb") rows = rows.filter(s => toolOf(s) === S.wdTab);
    if (!rows.length) return emptyBox("مفيش تسليمات حالية هنا 👍");
    return `<div class="space-y-3">${rows.map(wdRow).join("")}</div>`;
}

function renderWorkerDetail(workerId) {
    const w = workerById(workerId);
    if (!w) return `${pageHeader("الموظف مش موجود")}<a href="#/workers" class="text-indigo-500 font-black">← رجوع للموظفين</a>`;

    const subs = S.subs.filter(s => s.worker_id === workerId);
    const dy = subs.filter(s => isApprovedUnpaid(s) && toolOf(s) === "yazeed");
    const dt = subs.filter(s => isApprovedUnpaid(s) && toolOf(s) === "tayeb");
    const pend = subs.filter(s => s.status === "pending");
    const paid = subs.filter(isPaid);
    const idA = arg(workerId);
    const chip = (val, label) => `<button type="button" data-wdtab="${val}" onclick="setWdTab('${val}','${idA}')" class="chip ${S.wdTab === val ? "chip-active" : "chip-idle"}">${label}</button>`;

    return `
    <a href="#/workers" class="inline-flex items-center gap-1 text-sm font-black text-slate-500 hover:text-indigo-500 mb-4">→ كل الموظفين</a>

    <div class="card p-5 md:p-7 mb-6">
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-5">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 rounded-2xl bg-black dark:bg-white text-white dark:text-black flex items-center justify-center font-black text-2xl">${esc((w.full_name || "?").charAt(0))}</div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-2xl font-black">${esc(w.full_name || "-")}</h1>
                        ${w.active ? `<span class="px-2 py-1 rounded-full bg-emerald-500/10 text-emerald-500 text-xs font-black">نشط</span>` : `<span class="px-2 py-1 rounded-full bg-red-500/10 text-red-500 text-xs font-black">معطل</span>`}
                    </div>
                    <p class="text-sm text-slate-500 ltr">@${esc(w.username || "-")}</p>
                    <button type="button" onclick="copyText(unarg('${arg(w.cash_number || "")}'),'اتنسخ رقم الكاش 📋')" class="mt-1 text-sm font-black ltr hover:text-indigo-500">💳 ${esc(w.cash_number || "مفيش رقم")} 📋</button>
                </div>
            </div>
            <div class="flex flex-wrap gap-2">
                <button type="button" onclick="payWorkerTool('${idA}','all')" ${dy.length + dt.length ? "" : "disabled"} class="px-4 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm">💵 دفع الكل (${money(sum(dy, calcPrice) + sum(dt, calcPrice))})</button>
                <button type="button" onclick="resetWorkerPassword('${idA}')" class="px-4 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm">🔑 باسورد جديد</button>
                <button type="button" onclick="toggleWorkerActive('${idA}')" class="px-4 py-3 rounded-2xl font-black text-sm ${w.active ? "bg-red-500/10 text-red-500" : "bg-emerald-500/10 text-emerald-500"}">${w.active ? "🚪 تعطيل" : "🔄 تفعيل"}</button>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-6">
        <div class="rounded-3xl border p-4 md:p-5 bg-purple-500/10 border-purple-500/20">
            <p class="text-xs md:text-sm font-bold text-slate-500">🟣 مستحقات يزيد</p>
            <p class="text-2xl font-black mt-2 text-purple-500">${countSpan(sum(dy, calcPrice), true)}</p>
            ${dy.length ? `<button type="button" onclick="payWorkerTool('${idA}','yazeed')" class="mt-2 px-3 py-1.5 rounded-xl bg-purple-600 text-white text-xs font-black">💵 دفع يزيد</button>` : ""}
        </div>
        <div class="rounded-3xl border p-4 md:p-5 bg-orange-500/10 border-orange-500/20">
            <p class="text-xs md:text-sm font-bold text-slate-500">⚡ مستحقات الطيب</p>
            <p class="text-2xl font-black mt-2 text-orange-500">${countSpan(sum(dt, calcPrice), true)}</p>
            ${dt.length ? `<button type="button" onclick="payWorkerTool('${idA}','tayeb')" class="mt-2 px-3 py-1.5 rounded-xl bg-orange-500 text-white text-xs font-black">💵 دفع الطيب</button>` : ""}
        </div>
        ${statCard({ label: "قيد المراجعة", value: pend.length, tone: "yellow", icon: "⏳" })}
        ${statCard({ label: "إجمالي اللي اتدفعله", value: sum(paid, calcPrice), money: true, tone: "emerald", icon: "💸" })}
    </div>

    <div class="card p-5 md:p-6">
        <div class="flex flex-wrap gap-2 mb-4">
            ${chip("yazeed", "🟣 يزيد")}${chip("tayeb", "⚡ الطيب")}${chip("current", "🌍 كل الحالي")}${chip("paid", "📦 الأرشيف (المدفوع)")}

S.settle = { mode: "friday", date: "", tool: "all", excluded: new Set() };
S.histLimit = 15;

const SETTLE_MODES = {
    friday: "⚡ لحد آخر جمعة",
    today: "☀️ النهاردة بس",
    dayOnly: "🎯 يوم معين بس",
    upto: "📅 لحد يوم معين",
    all: "🌍 كل المعلق"
};

function settleScopeText() {
    const st = S.settle;
    if (st.mode === "friday") return `لحد ${prettyKey(lastFridayKey())}`;
    if (st.mode === "today") return `النهاردة ${prettyKey(todayKey())}`;
    if (st.mode === "dayOnly") return st.date ? `يوم ${prettyKey(st.date)}` : "";
    if (st.mode === "upto") return st.date ? `لحد ${prettyKey(st.date)}` : "";
    return "كل المعلق";
}

// نفس الفلتر بالظبط للعرض وللدفع — اللي بتشوفه هو اللي يتدفع
function settleRowsAll() {
    const st = S.settle;
    let rows = S.subs.filter(isApprovedUnpaid);
    if (st.tool !== "all") rows = rows.filter(s => toolOf(s) === st.tool);

    if (st.mode === "friday") { const k = lastFridayKey(); rows = rows.filter(s => dayKey(s.created_at) <= k); }
    else if (st.mode === "today") { const k = todayKey(); rows = rows.filter(s => dayKey(s.created_at) === k); }
    else if (st.mode === "dayOnly") rows = st.date ? rows.filter(s => dayKey(s.created_at) === st.date) : [];
    else if (st.mode === "upto") rows = st.date ? rows.filter(s => dayKey(s.created_at) <= st.date) : [];
    return rows;
}

function settleGroups() {
    const map = new Map();
    settleRowsAll().forEach(s => {
        if (!map.has(s.worker_id)) map.set(s.worker_id, []);
        map.get(s.worker_id).push(s);
    });
    return [...map.entries()].map(([workerId, rows]) => ({
        workerId, rows,
        y: rows.filter(s => toolOf(s) === "yazeed"),
        t: rows.filter(s => toolOf(s) === "tayeb"),
        total: sum(rows, calcPrice),
        selected: !S.settle.excluded.has(workerId)
    })).sort((a, b) => b.total - a.total);
}

function setSettle(key, value) {
    S.settle[key] = value;
    if (key === "mode" && (value === "dayOnly" || value === "upto") && !S.settle.date) S.settle.date = todayKey();
    S.settle.excluded = new Set();
    redrawSettle();
}

function toggleSettleWorker(idEnc) {
    const id = unarg(idEnc);
    if (S.settle.excluded.has(id)) S.settle.excluded.delete(id);
    else S.settle.excluded.add(id);
    redrawSettle();
}

function toggleSettleAll(checked) {
    S.settle.excluded = checked ? new Set() : new Set(settleGroups().map(g => g.workerId));
    redrawSettle();
}

function redrawSettle() {
    const box = $("settleBox");
    if (box) box.innerHTML = settleHtml();
}

function settleHtml() {
    const st = S.settle;
    const groups = settleGroups();
    const selected = groups.filter(g => g.selected);
    const selRows = selected.flatMap(g => g.rows);
    const needsDate = st.mode === "dayOnly" || st.mode === "upto";

    const modeChip = m => `<button type="button" onclick="setSettle('mode','${m}')" class="chip ${st.mode === m ? "chip-active" : "chip-idle"}">${SETTLE_MODES[m]}</button>`;
    const toolChip = (v, l) => `<button type="button" onclick="setSettle('tool','${v}')" class="chip ${st.tool === v ? "chip-active" : "chip-idle"}">${l}</button>`;

    const table = !groups.length ? emptyBox("مفيش مستحقات مقبولة ومش مدفوعة في الفترة دي 👌", "✅") : `
    <div class="overflow-x-auto rounded-2xl border border-slate-200 dark:border-white/10">
        <table class="dz-table w-full">
            <thead class="bg-slate-50 dark:bg-white/[.03]"><tr>
                <th><input type="checkbox" ${selected.length === groups.length ? "checked" : ""} onchange="toggleSettleAll(this.checked)" class="w-4 h-4 accent-emerald-600"></th>
                <th>الموظف</th><th>رقم الكاش</th>
                ${st.tool !== "tayeb" ? "<th>🟣 يزيد</th>" : ""}${st.tool !== "yazeed" ? "<th>⚡ الطيب</th>" : ""}
                <th>الإجمالي</th>
            </tr></thead>
            <tbody>${groups.map(g => {
                const w = workerById(g.workerId);
                return `<tr class="${g.selected ? "" : "opacity-40"}">
                    <td><input type="checkbox" ${g.selected ? "checked" : ""} onchange="toggleSettleWorker('${arg(g.workerId)}')" class="w-4 h-4 accent-emerald-600"></td>
                    <td>${workerLink(g.workerId)}<p class="text-[11px] text-slate-400">${g.rows.length} تسليمة</p></td>
                    <td><button type="button" onclick="copyText(unarg('${arg(w?.cash_number || "")}'),'اتنسخ رقم الكاش 📋')" class="font-bold ltr hover:text-indigo-500">${esc(w?.cash_number || "-")} 📋</button></td>
                    ${st.tool !== "tayeb" ? `<td><span class="font-black text-purple-500 num">${money(sum(g.y, calcPrice))}</span><p class="text-[11px] text-slate-400 num">${sum(g.y, s => Number(s.valid_count || 0))} Valid</p></td>` : ""}
                    ${st.tool !== "yazeed" ? `<td><span class="font-black text-orange-500 num">${money(sum(g.t, calcPrice))}</span><p class="text-[11px] text-slate-400 num">${sum(g.t, s => Number(s.valid_count || 0))} Valid</p></td>` : ""}
                    <td class="font-black text-emerald-500 num text-base">${money(g.total)}</td>
                </tr>`;
            }).join("")}</tbody>
        </table>

    return `
    <div class="space-y-4">
