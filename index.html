            <p class="text-xs font-black text-slate-500 mb-2">١. اختار الفترة</p>
            <div class="flex flex-wrap gap-2">${Object.keys(SETTLE_MODES).map(modeChip).join("")}</div>
            ${needsDate ? `<input type="date" value="${esc(st.date)}" onchange="S.settle.date=this.value; S.settle.excluded=new Set(); redrawSettle()" class="input ltr !w-auto mt-3">` : ""}
            <div class="flex flex-wrap gap-2 mt-3">${toolChip("all", "يزيد + الطيب")}${toolChip("yazeed", "🟣 يزيد بس")}${toolChip("tayeb", "⚡ الطيب بس")}</div>
            <p class="text-xs text-slate-500 mt-3">📅 النطاق: <b>${esc(settleScopeText() || "اختار تاريخ")}</b> — بيحسب المقبول اللي لسه ماتدفعش بس، واللي اتدفع قبل كده عمره ما بيتحسب تاني.</p>
        </div>

        <div>
            <div class="flex items-center justify-between gap-2 mb-2">
                <p class="text-xs font-black text-slate-500">٢. راجع (شيل العلامة من أي موظف مش عايز تدفعله دلوقتي)</p>
                ${groups.length ? `<button type="button" onclick="exportSettleExcel()" class="px-3 py-1.5 rounded-xl bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 text-xs font-black">📊 تحميل Excel</button>` : ""}
            </div>
            ${table}
        </div>

        <div class="rounded-2xl bg-emerald-500/10 border border-emerald-500/25 p-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div>
                <p class="text-xs font-black text-slate-500">٣. أكّد الدفع</p>
                <p class="text-2xl font-black text-emerald-500 num mt-1">${money(sum(selRows, calcPrice))}</p>
                <p class="text-xs text-slate-500">${selected.length} موظف · ${selRows.length} تسليمة</p>
            </div>
            <button type="button" onclick="confirmSettlement()" ${selRows.length ? "" : "disabled"} class="px-6 py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-lg shadow-lg shadow-emerald-600/25">💸 تأكيد الدفع ونقل للأرشيف</button>
        </div>
    </div>`;
}

function confirmSettlement() {
    const groups = settleGroups().filter(g => g.selected);
    const rows = groups.flatMap(g => g.rows);
    if (!rows.length) return;
    const scope = settleScopeText();
    confirmDialog({
        title: "تأكيد التقفيل", icon: "💸",
        text: `${scope}\n${groups.length} موظف — ${rows.length} تسليمة\nالإجمالي: ${money(sum(rows, calcPrice))}\n\n📦 التسليمات دي بس هتتنقل للأرشيف، والباقي هيفضل قيد الحساب.`,
        confirmText: "تأكيد الدفع 💸", confirmClass: "bg-emerald-600 text-white",
        onConfirm: async () => {
            const ok = await payRows(rows, scope);
            if (ok) S.settle.excluded = new Set();
        }
    });
}

function exportSettleExcel() {
    if (typeof XLSX === "undefined") return toast("مكتبة Excel ماتحملتش، جرّب تاني", "error");
    const groups = settleGroups().filter(g => g.selected);
    const data = groups.map(g => {
        const w = workerById(g.workerId);
        return {
            "الموظف": w?.full_name || "",
            "اليوزر": w?.username || "",
            "رقم الكاش": w?.cash_number || "",
            "يزيد Valid": sum(g.y, s => Number(s.valid_count || 0)),
            "يزيد (ج.م)": sum(g.y, calcPrice),
            "الطيب Valid": sum(g.t, s => Number(s.valid_count || 0)),
            "الطيب (ج.م)": sum(g.t, calcPrice),
            "الإجمالي (ج.م)": g.total,
            "عدد التسليمات": g.rows.length
        };
    });
    data.push({
        "الموظف": "الإجمالي", "اليوزر": "", "رقم الكاش": "",
        "يزيد Valid": sum(data, r => r["يزيد Valid"]), "يزيد (ج.م)": sum(data, r => r["يزيد (ج.م)"]),
        "الطيب Valid": sum(data, r => r["الطيب Valid"]), "الطيب (ج.م)": sum(data, r => r["الطيب (ج.م)"]),
        "الإجمالي (ج.م)": sum(data, r => r["الإجمالي (ج.م)"]), "عدد التسليمات": sum(data, r => r["عدد التسليمات"])
    });
    const ws = XLSX.utils.json_to_sheet(data);
    ws["!cols"] = [{ wch: 22 }, { wch: 16 }, { wch: 14 }, { wch: 10 }, { wch: 12 }, { wch: 10 }, { wch: 12 }, { wch: 14 }, { wch: 12 }];
    const wb = XLSX.utils.book_new();
    wb.Workbook = { Views: [{ RTL: true }] };
    XLSX.utils.book_append_sheet(wb, ws, "التقفيل");
    XLSX.writeFile(wb, `DARKZONE_تقفيل_${todayKey()}.xlsx`);
}

async function doPurge(row) {
    // نمسح الملفات من الستوراج الأول، وبعدها نشيل مسارها من التسليمة (الأرقام بتفضل)
    const removals = [];
    if (row.work_file) removals.push(db.storage.from("work-files").remove([row.work_file]));
    if (row.proof_image) removals.push(db.storage.from("proofs").remove([row.proof_image]));
    await Promise.allSettled(removals);
    const { error } = await db.rpc("owner_clear_submission_files", { p_submission_id: row.id });
    return error;
}

function purgeFiles(idEnc) {
    const id = unarg(idEnc);
    const row = S.subs.find(s => s.id === id);
    if (!row) return;
    confirmDialog({
        title: "حذف الملفات نهائياً", icon: "🗑️",
        text: `${profileName(row.worker_id)} — ${fmtDate(row.created_at)}\nهيتمسح ملف التكست وصورة الاتشيكر خالص ومش هيرجعوا.\nالأرقام والمبلغ هيفضلوا في السجل زي ما هم.`,
        confirmText: "حذف نهائي", confirmClass: "bg-red-600 text-white",
        onConfirm: async () => {
            const err = await doPurge(row);
            if (err) { toast(friendlyError(err), "error"); return; }
            toast("اتمسحت الملفات 🗑️", "success");
            await reloadAndRefresh();
        }
    });
}

function purgeAllTrash() {
    const rows = S.subs.filter(s => isPaid(s) && (s.work_file || s.proof_image));
    if (!rows.length) return toast("المهملات فاضية", "info");
    confirmDialog({
        title: "تفريغ المهملات كلها", icon: "🧹",
        text: `هتتمسح ملفات ${rows.length} تسليمة مدفوعة خالص ومش هترجع.\nكل الأرقام والمبالغ هتفضل في السجل زي ما هي.`,
        confirmText: `حذف كل الملفات (${rows.length})`, confirmClass: "bg-red-600 text-white",
        onConfirm: async () => {
            let ok = 0, fail = 0;
            for (const r of rows) { const err = await doPurge(r); if (err) fail++; else ok++; }
            toast(fail ? `اتمسح ${ok} و ${fail} فشلوا` : `🧹 اتمسحت ملفات ${ok} تسليمة`, fail ? "warning" : "success");
            await reloadAndRefresh();
        }
    });
}

const AR_RUN = /[؀-ۿ](?:[؀-ۿً-ٟ\s\.،؟]*[؀-ۿً-ٟ؟])?/g;
const HAS_AR = /[؀-ۿ]/;
const EN_MAP = new Map(Object.entries(EN).map(([k, v]) => [k.replace(/\s+/g, " ").trim(), v]));

function translateRun(run) {
    const norm = run.replace(/\s+/g, " ").trim();
    if (EN_MAP.has(norm)) return EN_MAP.get(norm);
    // ترجمة كلمة بكلمة بأطول جملة متاحة في القاموس
    const words = norm.split(" ");
    const out = [];
    let i = 0;
    while (i < words.length) {
        let found = false;
        for (let len = Math.min(10, words.length - i); len > 0; len--) {
            const phrase = words.slice(i, i + len).join(" ");
            if (EN_MAP.has(phrase)) { out.push(EN_MAP.get(phrase)); i += len; found = true; break; }
        }
        if (!found) { out.push(words[i]); i++; }
    }
    return out.filter(Boolean).join(" ");
}

function translateText(str) {
    return HAS_AR.test(str) ? str.replace(AR_RUN, translateRun) : str;
}

function skipNode(el) {
    return !el || el.closest?.("[data-noi18n], script, style, textarea");
}

function translateTree(root) {
    if (lang !== "en" || !root) return;
    if (root.nodeType === 3) {
        if (!skipNode(root.parentElement) && HAS_AR.test(root.nodeValue)) {
            const t = translateText(root.nodeValue);
            if (t !== root.nodeValue) root.nodeValue = t;
        }
        return;
    }
    if (root.nodeType !== 1 || skipNode(root)) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let n;
    const nodes = [];
    while ((n = walker.nextNode())) nodes.push(n);
    nodes.forEach(node => {
        if (skipNode(node.parentElement) || !HAS_AR.test(node.nodeValue)) return;
        const t = translateText(node.nodeValue);
        if (t !== node.nodeValue) node.nodeValue = t;
    });
    [root, ...root.querySelectorAll("[placeholder],[title]")].forEach(el => {
        if (skipNode(el)) return;
        ["placeholder", "title"].forEach(a => {
            const v = el.getAttribute?.(a);
            if (v && HAS_AR.test(v)) el.setAttribute(a, translateText(v));
        });
    });
    if (root === document.body) document.title = translateText(document.title);
}

const i18nObserver = new MutationObserver(muts => {
    if (lang !== "en") return;
    muts.forEach(m => {
        if (m.type === "characterData") translateTree(m.target);
        else m.addedNodes.forEach(translateTree);
    });
});

function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
    document.querySelectorAll(".langBtn").forEach(b => { b.textContent = lang === "en" ? "عربي" : "EN"; });
    if (lang === "en") {
        translateTree(document.body);
        i18nObserver.observe(document.body, { childList: true, subtree: true, characterData: true });
    }
}

function toggleLanguage() {
    if (lang === "en") {
        // الرجوع للعربي: نحمّل الصفحة من جديد (الجلسة بتفضل محفوظة)
        safeSet("elbob_language", "ar");
        location.reload();
        return;
    }
    lang = "en";
    safeSet("elbob_language", "en");
    applyLang();
    if (S.me) renderRoute(); // نعيد رسم الصفحة بالتواريخ والعملة بالإنجليزي
}

document.addEventListener("DOMContentLoaded", applyLang);
