S.keys = [];
S.keyReqs = [];
S.keysReady = false;
S.keyTab = "pending";
S.keySearch = "";
S.keyReveal = new Set();

const KEY_KIND = {
    first: { label: "أول مفتاح", icon: "🔑", cls: "bg-sky-500/10 text-sky-600 dark:text-sky-400" },
    replace: { label: "المفتاح الأساسي باظ", icon: "🔧", cls: "bg-orange-500/10 text-orange-600 dark:text-orange-400" },
    extra: { label: "مفاتيح إضافية", icon: "➕", cls: "bg-purple-500/10 text-purple-600 dark:text-purple-400" }
};
const KEY_LOW_STOCK = 3;
const KEY_SHAPE = /^[A-Z0-9]{2,}(-[A-Z0-9]{3,}){2,}$/i;

async function loadKeys() {
    if (!S.me || S.me.role === "supervisor") return;
    const [k, r] = await Promise.all([
        fetchAll(() => db.from("tool_keys").select("*").order("added_at", { ascending: false }).order("id")),
        db.from("key_requests").select("*").order("created_at", { ascending: false }).limit(500)
    ]);
    if (k.error || r.error) {
        // الجداول لسه ماتعملتش (keys_215.sql ماتشغلش)
        S.keysReady = false;
        S.keysError = (k.error || r.error)?.message || "";
        console.error("keys load:", k.error || r.error);
        S.keys = []; S.keyReqs = [];
        return;
    }
    S.keysReady = true;
    S.keysError = "";
    S.keys = k.data || [];
    S.keyReqs = r.data || [];
}

const pendingKeyReqs = () => S.keyReqs.filter(r => r.status === "pending");
const vaultKeys = () => S.keys.filter(k => k.status === "available");
const myKeys = () => S.keys.filter(k => k.status === "assigned" && k.worker_id === S.user?.id);
const myMainKey = () => myKeys().find(k => k.is_main) || null;
const myExtraKeys = () => myKeys().filter(k => !k.is_main);
const myPendingReq = () => S.keyReqs.find(r => r.status === "pending" && r.worker_id === S.user?.id) || null;

function keyError(e) {
    if (e?.code === "23505") return "عندك طلب لسه مستني موافقة الإدارة";
    return friendlyError(e);
}

// V5-7RDM-JUHZ-0ETS → V5-••••-••••-0ETS
function maskKey(v) {
    const parts = String(v || "").split("-");
    if (parts.length >= 3) return parts.map((p, i) => (i === 0 || i === parts.length - 1) ? p : "•".repeat(p.length)).join("-");
    const s = String(v || "");
    return s.length > 6 ? s.slice(0, 3) + "•".repeat(s.length - 6) + s.slice(-3) : "•".repeat(s.length);
}

function keyById(idEnc) { const id = unarg(idEnc); return S.keys.find(k => k.id === id); }

function copyKey(idEnc) {
    const k = keyById(idEnc);
    if (k) copyText(k.key_value, "اتنسخ المفتاح 🔑");
}

function toggleKeyReveal(idEnc) {
    const id = unarg(idEnc);
    if (S.keyReveal.has(id)) S.keyReveal.delete(id); else S.keyReveal.add(id);
    refreshKeysPage();
}

function refreshKeysPage() {
    const { name } = parseRoute();
    if (name !== "keys") return;
    const y = window.scrollY;
    mountPage(isOwner() ? renderOwnerKeys() : renderWorkerKeys(), afterKeysPage);
    window.scrollTo(0, y);
}

function keyStatusBadge(status) {
    const m = {
        pending: ["⏳ مستني موافقة", "bg-yellow-500/10 text-yellow-600 dark:text-yellow-400"],
        approved: ["✅ اتوافق عليه", "bg-emerald-500/10 text-emerald-600 dark:text-emerald-400"],
        rejected: ["❌ اترفض", "bg-red-500/10 text-red-600 dark:text-red-400"],
        cancelled: ["↩️ اتلغى", "bg-slate-500/10 text-slate-500"]
    }[status] || ["-", ""];
    return `<span class="px-2.5 py-1 rounded-full text-[11px] font-black ${m[1]}">${m[0]}</span>`;
}

function kindBadge(kind) {
    const k = KEY_KIND[kind] || KEY_KIND.first;
    return `<span class="px-2.5 py-1 rounded-full text-[11px] font-black ${k.cls}">${k.icon} ${k.label}</span>`;
}

function keyMono(k, big = false) {
    const shown = S.keyReveal.has(k.id) ? k.key_value : maskKey(k.key_value);
    return `<span class="ltr inline-block font-mono font-black tracking-wider ${big ? "text-xl md:text-2xl" : "text-sm"} select-all">${esc(shown)}</span>`;
}

function keyButtons(k, { dismiss = false } = {}) {
    const id = arg(k.id);
    return `
    <div class="flex items-center gap-1.5 shrink-0">
        <button type="button" onclick="toggleKeyReveal('${id}')" class="w-9 h-9 rounded-xl bg-slate-200 dark:bg-white/10 text-sm" title="إظهار">${S.keyReveal.has(k.id) ? "🙈" : "👁"}</button>
        <button type="button" onclick="copyKey('${id}')" class="px-3.5 h-9 rounded-xl bg-purple-600 hover:bg-purple-700 text-white text-xs font-black">📋 نسخ</button>
        ${dismiss ? `<button type="button" onclick="dismissExtraKey('${id}')" class="px-3 h-9 rounded-xl bg-red-500/10 text-red-500 text-xs font-black" title="خلصت منه">🗑️</button>` : ""}
    </div>`;
}

function renderWorkerKeys() {
    const t = TOOLS.yazeed;
    const hero = `

    if (!S.keysReady) return hero + emptyBox("المفاتيح لسه مش متفعلة — استنى الإدارة", "🔒");

/* إشعارات الموظف: مفتاح جديد وصل / طلب اترفض */
function keysSeenKey() { return "dz_keys_seen_" + (S.user?.id || ""); }

function keysSnapshot() {
    const r = {};
    S.keyReqs.forEach(x => { r[x.id] = x.status; });
    return { k: myKeys().map(k => k.id), r };
}

function checkKeyNotifications() {
    if (!S.keysReady || S.me?.role !== "worker") return;
    let prev = null;
    try { prev = JSON.parse(safeGet(keysSeenKey()) || "null"); } catch (e) { prev = null; }
    const now = keysSnapshot();
    safeSet(keysSeenKey(), JSON.stringify(now));
    if (!prev) return; // أول مرة

    const fresh = myKeys().filter(k => !prev.k.includes(k.id));
    const rejected = S.keyReqs.filter(r => r.status === "rejected" && prev.r[r.id] === "pending");

    if (fresh.length) {
        Sound.celebrate();
        confetti(60);
        const main = fresh.some(k => k.is_main);
        openModalHtml(`
            <div class="text-center">
                <div class="pop w-20 h-20 mx-auto rounded-full bg-purple-600 text-white flex items-center justify-center text-4xl mb-4">🔑</div>
                <h3 class="text-xl font-black">${main ? "وصلك مفتاحك!" : `وصلك ${fresh.length} مفتاح إضافي`}</h3>
                <p class="text-slate-500 mt-2">الإدارة وافقت على طلبك — المفاتيح في صفحة "مفاتيحي"</p>
                <button type="button" onclick="closeTopModal(true); go('keys')" class="w-full mt-6 py-3.5 rounded-2xl bg-gradient-to-r ${TOOLS.yazeed.grad} text-white font-black">🔑 افتح مفاتيحي</button>
            </div>`);
    } else if (rejected.length) {
        Sound.soft();
        const r = rejected[0];
        toast(`❌ طلب المفتاح اترفض${r.owner_note ? " — " + r.owner_note : ""}`, "error");
    }
}

/* ---------------- الأونر ---------------- */

function parseKeysInput(text) {
    const seen = new Set();
    const keys = [], odd = [];
    String(text || "").split(/\r?\n/).forEach(line => {
        const k = line.replace(/^\s*(\d+\s*[.)\-:]|[-*•])\s*/, "").trim();
        if (!k || seen.has(k)) return;
        seen.add(k);
        keys.push(k);
        if (!KEY_SHAPE.test(k) || k.length < 4) odd.push(k);
    });
    return { keys, odd };
}

function workerNameById(id) {
    const w = S.workers.find(x => x.id === id);
    return w ? (w.full_name || w.username || "—") : "موظف";
}

function keyReqCard(r) {
    const avail = vaultKeys().length;
    const enough = avail >= r.qty;
    const mainNow = S.keys.find(k => k.worker_id === r.worker_id && k.status === "assigned" && k.is_main);
    return `
    <div class="card p-4 md:p-5">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="min-w-0">
                <div class="flex flex-wrap items-center gap-2">
                    ${workerLink(r.worker_id)} ${kindBadge(r.kind)}
                    ${r.kind === "extra" ? `<span class="px-2.5 py-1 rounded-full bg-purple-500/10 text-purple-500 text-[11px] font-black num">× ${r.qty}</span>` : ""}
                </div>
                ${r.reason ? `<p class="text-sm mt-2">💬 <b>${esc(r.reason)}</b></p>` : ""}
                ${r.kind === "replace" && mainNow ? `<p class="text-[11px] text-slate-500 mt-1">المفتاح اللي باظ: <span class="ltr inline-block font-mono">${esc(mainNow.key_value)}</span></p>` : ""}
                <p class="text-[11px] text-slate-400 mt-1">${fmtDate(r.created_at)}</p>

            <div class="flex items-center gap-2 shrink-0">
                <button type="button" onclick="reviewKeyRequest('${arg(r.id)}', true)" ${enough ? "" : "disabled"} class="px-4 py-2.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm">✅ قبول</button>
                <button type="button" onclick="reviewKeyRequest('${arg(r.id)}', false)" class="px-4 py-2.5 rounded-2xl bg-red-500/10 text-red-500 font-black text-sm">❌ رفض</button>
            </div>
        </div>
        ${enough ? "" : `<p class="mt-3 text-xs font-black text-red-500">⚠️ الخزنة فيها ${avail} مفتاح بس — ضيف مفاتيح الأول</p>`}
    </div>`;
}

function reviewKeyRequest(idEnc, approve) {
    const r = S.keyReqs.find(x => x.id === unarg(idEnc));
    if (!r) return;
    const who = workerNameById(r.worker_id);
    const what = r.kind === "extra" ? `${r.qty} مفتاح إضافي` : (r.kind === "replace" ? "مفتاح بدل الأساسي اللي باظ" : "أول مفتاح");
    confirmDialog({
        title: approve ? "قبول الطلب" : "رفض الطلب", icon: approve ? "✅" : "❌",
        text: `${who} — ${what}${r.reason ? "\nالسبب: " + r.reason : ""}${approve ? `\n\nهيتسحب ${r.qty} من الخزنة (فيها ${vaultKeys().length}).` : ""}`,
        input: { label: approve ? "رسالة للموظف (اختياري)" : "سبب الرفض (هيظهر للموظف)", placeholder: approve ? "مثلاً: بالتوفيق" : "مثلاً: استخدم المفتاح اللي معاك", textarea: true },
        confirmText: approve ? "قبول ✅" : "رفض ❌",
        confirmClass: approve ? "bg-emerald-600 text-white" : "bg-red-600 text-white",
        onConfirm: async note => {
            const { data, error } = await db.rpc("owner_review_key_request", { p_request: r.id, p_approve: approve, p_note: (note || "").trim() || null });
            if (error) { toast(keyError(error), "error"); return; }
            if (approve) Sound.money();
            toast(approve ? `✅ اتبعت ${data} مفتاح لـ ${who}` : "اترفض الطلب", "success");
            await reloadAndRefresh();
        }
    });
}

function previewKeysInput() {
    const box = $("keysPreview");
    if (!box) return;
    const { keys, odd } = parseKeysInput($("keysInput").value);
    const dupInVault = keys.filter(k => S.keys.some(x => x.key_value === k)).length;
    box.innerHTML = !keys.length ? "" : `
        <span class="font-black text-emerald-500">هيتضاف ${keys.length - dupInVault} مفتاح</span>
        ${dupInVault ? `<span class="text-slate-500"> · ${dupInVault} موجودين قبل كده هيتجاهلوا</span>` : ""}
        ${odd.length ? `<span class="block text-yellow-600 dark:text-yellow-400 mt-1">⚠️ ${odd.length} سطر شكله مختلف عن باقي المفاتيح: <span class="ltr inline-block font-mono">${esc(odd.slice(0, 3).join("  |  "))}</span></span>` : ""}`;
}

async function addKeysToVault() {
    const { keys } = parseKeysInput($("keysInput").value);
    if (!keys.length) return toast("الصق المفاتيح الأول — كل مفتاح في سطر", "warning");
    const btn = $("addKeysBtn");
    setLoading(btn, "جاري الإضافة...");
    const { data, error } = await db.rpc("owner_add_keys", { p_keys: keys });

    btn.textContent = "➕ ضيف للخزنة";

    toast(`✅ اتضاف ${data} مفتاح للخزنة${keys.length - data ? ` (${keys.length - data} كانوا موجودين)` : ""}`, "success");
    await reloadAndRefresh();
}

function setKeyTab(tab) { S.keyTab = tab; redrawKeyTab(); }
function setKeySearch(v) { S.keySearch = v; redrawKeyTab(); }

function redrawKeyTab() {
    const box = $("keyTabBox");
    if (box) box.innerHTML = keyTabHtml();
    document.querySelectorAll("[data-ktab]").forEach(b => b.className = "chip " + (b.dataset.ktab === S.keyTab ? "chip-active" : "chip-idle"));
}

function keyMatches(k) {
    const q = S.keySearch.trim().toLowerCase();
    if (!q) return true;
    return k.key_value.toLowerCase().includes(q) || (k.worker_id && workerNameById(k.worker_id).toLowerCase().includes(q));
}

function keyTabHtml() {
    const tab = S.keyTab;
    const row = (k, right) => `
        <div class="flex flex-wrap items-center justify-between gap-2 rounded-xl bg-slate-50 dark:bg-white/[.03] px-3 py-2.5">
            <div class="min-w-0">
                <span class="ltr inline-block font-mono font-black text-sm">${esc(k.key_value)}</span>
                ${k.worker_id && tab !== "vault" ? `<span class="text-xs text-slate-500"> · ${workerLink(k.worker_id)}</span>` : ""}
            </div>
            <div class="flex items-center gap-1.5">${right}</div>
        </div>`;

    if (tab === "pending") {
        const list = pendingKeyReqs();
        return list.length ? `<div class="space-y-3">${list.map(keyReqCard).join("")}</div>` : emptyBox("مفيش طلبات مستنية 👌", "✅");
    }

    if (tab === "vault") {
        const list = vaultKeys().filter(keyMatches).sort((a, b) => new Date(a.added_at) - new Date(b.added_at));
        if (!list.length) return emptyBox("الخزنة فاضية — ضيف مفاتيح من فوق", "📦");
        return `<p class="text-xs text-slate-500 mb-2">بيتدّوا بالترتيب ده — الأقدم الأول</p><div class="space-y-1.5">${list.map(k => row(k, `
            <span class="text-[11px] text-slate-400">${fmtShortDate(k.added_at)}</span>
            <button type="button" onclick="deleteVaultKey('${arg(k.id)}')" class="px-2.5 py-1 rounded-lg bg-red-500/10 text-red-500 text-[11px] font-black">🗑️</button>`)).join("")}</div>`;
    }

    if (tab === "assigned") {
        const list = S.keys.filter(k => k.status === "assigned" && keyMatches(k));
        if (!list.length) return emptyBox("مفيش مفاتيح مع موظفين لسه", "👷");
        const byW = new Map();
        list.forEach(k => { if (!byW.has(k.worker_id)) byW.set(k.worker_id, []); byW.get(k.worker_id).push(k); });
        return `<div class="space-y-3">${[...byW.entries()].map(([wid, ks]) => `
            <div class="rounded-2xl border border-slate-200 dark:border-white/10 p-3">
                <div class="flex items-center justify-between mb-2">${workerLink(wid)}<span class="text-xs text-slate-500 num">${ks.length} مفتاح</span></div>
                <div class="space-y-1.5">${ks.sort((a, b) => b.is_main - a.is_main).map(k => `
                    <div class="flex flex-wrap items-center justify-between gap-2 rounded-xl bg-slate-50 dark:bg-white/[.03] px-3 py-2">
                        <div class="flex items-center gap-2 min-w-0">
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-black ${k.is_main ? "bg-purple-500/10 text-purple-500" : "bg-slate-500/10 text-slate-500"}">${k.is_main ? "🔑 أساسي" : "➕ إضافي"}</span>

                    </div>`).join("")}</div>
            </div>`).join("")}</div>`;
    }

    if (tab === "closed") {
        const label = { broken: ["💀 باظ", "text-red-500"], used: ["✔️ اتستخدم", "text-slate-500"], removed: ["⛔ اتسحب", "text-orange-500"] };
        const list = S.keys.filter(k => ["broken", "used", "removed"].includes(k.status) && keyMatches(k))
            .sort((a, b) => new Date(b.closed_at || 0) - new Date(a.closed_at || 0)).slice(0, 200);
        if (!list.length) return emptyBox("مفيش مفاتيح بايظة أو مستخدمة", "🗂️");
        return `<div class="space-y-1.5">${list.map(k => row(k, `
            <span class="text-[11px] font-black ${label[k.status][1]}">${label[k.status][0]}</span>
            <span class="text-[11px] text-slate-400">${k.closed_at ? fmtShortDate(k.closed_at) : ""}</span>
            <button type="button" onclick="deleteVaultKey('${arg(k.id)}')" class="px-2 py-1 rounded-lg bg-red-500/10 text-red-500 text-[11px] font-black" title="مسح من السجل">🗑️</button>`)).join("")}</div>`;
    }

    // history
    const list = S.keyReqs.filter(r => r.status !== "pending").slice(0, 100);
    if (!list.length) return emptyBox("لسه مفيش طلبات", "📜");
    return `<div class="space-y-2">${list.map(r => `
        <div class="rounded-xl bg-slate-50 dark:bg-white/[.03] px-3 py-2.5 flex flex-wrap items-center justify-between gap-2">
            <div class="min-w-0">
                <div class="flex flex-wrap items-center gap-2">${workerLink(r.worker_id)} ${kindBadge(r.kind)} ${r.kind === "extra" ? `<span class="text-xs font-black num">× ${r.qty}</span>` : ""}</div>
                ${r.reason ? `<p class="text-xs text-slate-500 mt-1">السبب: ${esc(r.reason)}</p>` : ""}
                ${r.owner_note ? `<p class="text-xs mt-0.5">💬 ${esc(r.owner_note)}</p>` : ""}
            </div>
            <div class="text-end">${keyStatusBadge(r.status)}<p class="text-[11px] text-slate-400 mt-1">${fmtDate(r.reviewed_at || r.created_at)}</p></div>
        </div>`).join("")}</div>`;
}

PAGES.worker.keys = KEYS_PAGE_WORKER;

/* =========================================================
   🎥 الشروحات — الأونر بيضيف فيديوهات يوتيوب، والموظف بيتفرّج جوه الموقع
   محفوظة في site_settings.tutorials (jsonb): [{ id, title, yt, tool, note, pinned }]
========================================================= */

S.videoPlaying = null;

// بيطلّع ID الفيديو من أي شكل لينك يوتيوب
function ytId(url) {
    const u = String(url || "").trim();
    if (/^[\w-]{11}$/.test(u)) return u;
    const m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([\w-]{11})/i);
    return m ? m[1] : "";
}

function cleanTutorials(raw) {
    let list = raw;
    if (typeof list === "string") { try { list = JSON.parse(list); } catch (e) { list = []; } }
    if (!Array.isArray(list)) return [];
    return list.slice(0, 50).map(v => ({
        id: String(v?.id || "").replace(/[^a-z0-9]/gi, "").slice(0, 20) || Math.random().toString(36).slice(2, 10),
        title: String(v?.title || "").trim().slice(0, 80),
        yt: ytId(v?.yt),
        tool: ["yazeed", "tayeb"].includes(v?.tool) ? v.tool : "",
        note: String(v?.note || "").trim().slice(0, 300),
        pinned: !!v?.pinned
    })).filter(v => v.title && v.yt);
}

const tutorials = () => S.settings.tutorials || [];
const sortedTutorials = () => [...tutorials()].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
const ytThumb = id => `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
// يوتيوب لازم يعرف الموقع اللي بيعرض الفيديو (وإلا بيطلع "خطأ 153")
const ytEmbed = id => {
    const origin = /^https?:/.test(location.origin) ? `&origin=${encodeURIComponent(location.origin)}&widget_referrer=${encodeURIComponent(location.origin + "/")}` : "";
    return `https://www.youtube.com/embed/${id}?rel=0&modestbranding=1&playsinline=1&enablejsapi=0${origin}`;
};

function tutorialTag(v) {
    if (!v.tool) return `<span class="px-2 py-0.5 rounded-full bg-sky-500/10 text-sky-500 text-[11px] font-black">🌐 الموقع</span>`;
    const t = TOOLS[v.tool];
    return `<span class="px-2 py-0.5 rounded-full ${t.bg} ${t.text} text-[11px] font-black">${t.icon} ${t.name}</span>`;
}

function playerHtml(v) {
    return `
    <div class="card overflow-hidden mb-6">
        <div class="relative w-full bg-black" style="aspect-ratio:16/9">
            <iframe src="${ytEmbed(v.yt)}" title="${esc(v.title)}" class="absolute inset-0 w-full h-full" frameborder="0" referrerpolicy="strict-origin-when-cross-origin"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
        <div class="p-5 md:p-6">
            <div class="flex flex-wrap items-center gap-2 mb-2">${tutorialTag(v)}${v.pinned ? `<span class="px-2 py-0.5 rounded-full bg-yellow-400 text-black text-[11px] font-black">⭐ ابدأ بده</span>` : ""}</div>
            <h2 class="text-xl md:text-2xl font-black">${esc(v.title)}</h2>
            ${v.note ? `<p class="text-sm text-slate-500 dark:text-slate-400 mt-2 leading-7 whitespace-pre-line">${esc(v.note)}</p>` : ""}
            <a href="https://www.youtube.com/watch?v=${v.yt}" target="_blank" rel="noopener" class="inline-flex items-center gap-2 mt-4 px-4 py-2.5 rounded-2xl bg-red-600 hover:bg-red-700 text-white text-sm font-black">▶ لو الفيديو مااشتغلش هنا، افتحه على يوتيوب ↗</a>
        </div>
    </div>`;
}

function tutorialCardHtml(v) {
    const idA = arg(v.id);
    const active = S.videoPlaying === v.id;
    return `
    <div class="card overflow-hidden ${active ? "ring-2 ring-red-500" : ""}">
        <button type="button" onclick="playTutorial('${idA}')" class="relative block w-full bg-black group" style="aspect-ratio:16/9">
            <img src="${ytThumb(v.yt)}" alt="" loading="lazy" class="absolute inset-0 w-full h-full object-cover opacity-90 group-hover:opacity-100 transition">
            <span class="absolute inset-0 flex items-center justify-center">
                <span class="w-16 h-16 rounded-full bg-red-600 shadow-xl shadow-red-600/40 flex items-center justify-center text-white text-2xl group-hover:scale-110 transition">▶</span>
            </span>
            ${v.pinned ? `<span class="absolute top-3 right-3 px-2 py-1 rounded-lg bg-yellow-400 text-black text-[11px] font-black">⭐ ابدأ بده</span>` : ""}
        </button>
        <div class="p-4">
            <div class="mb-1.5">${tutorialTag(v)}</div>
            <p class="font-black leading-6">${esc(v.title)}</p>
            ${v.note ? `<p class="text-xs text-slate-500 mt-1.5 leading-5">${esc(v.note)}</p>` : ""}
            <button type="button" onclick="playTutorial('${idA}')" class="w-full mt-3 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-sm font-black">▶ اتفرّج على يوتيوب</button>
            ${isOwner() ? `
            <div class="flex flex-wrap gap-1.5 mt-3">
                ${!v.pinned ? `<button type="button" onclick="pinTutorial('${idA}')" class="px-2.5 py-1 rounded-lg bg-yellow-500/10 text-yellow-600 dark:text-yellow-400 text-[11px] font-black">⭐ خليه الأول</button>` : ""}
                <button type="button" onclick="editTutorial('${idA}')" class="px-2.5 py-1 rounded-lg bg-slate-200 dark:bg-white/10 text-[11px] font-black">✏️ تعديل</button>
                <button type="button" onclick="deleteTutorial('${idA}')" class="px-2.5 py-1 rounded-lg bg-red-500/10 text-red-500 text-[11px] font-black">🗑️ مسح</button>
            </div>` : ""}
        </div>
    </div>`;
}

function renderVideos() {
    const list = sortedTutorials();
    const playing = list.find(v => v.id === S.videoPlaying) || null;
    const hero = `
    <div class="rounded-3xl p-6 md:p-8 mb-6 text-white bg-gradient-to-br from-red-600 via-rose-600 to-purple-700 shadow-xl relative overflow-hidden">
        <div class="absolute -left-4 -top-6 text-[120px] opacity-15 leading-none select-none">🎥</div>
        <p class="text-white/80 font-bold">DARK ZONE</p>
        <h1 class="text-3xl md:text-4xl font-black mt-1">الشروحات</h1>
        <p class="text-white/85 text-sm mt-2">${isOwner() ? "ضيف لينك أي فيديو يوتيوب، والموظفين هيتفرّجوا عليه هنا" : "اتفرّج على الشرح خطوة بخطوة — ابدأ بالفيديو ⭐"}</p>
        ${isOwner() ? `<button type="button" onclick="editTutorial()" class="mt-4 px-5 py-3 rounded-2xl bg-white text-slate-900 font-black">➕ إضافة فيديو</button>` : ""}
    </div>`;

    if (!list.length) {
        return hero + emptyBox(isOwner() ? "لسه مفيش فيديوهات — دوس \"➕ إضافة فيديو\"" : "الشروحات هتنزل قريب 🎬", "🎥");
    }
    return `${hero}
    ${playing ? playerHtml(playing) : ""}
    <div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">${list.map(tutorialCardHtml).join("")}</div>`;
}

// الفيديو بيفتح على يوتيوب على طول (المشغّل جوه الموقع كان بيطلع خطأ 153)
function playTutorial(idEnc) {
    const v = tutorials().find(x => x.id === unarg(idEnc));
    if (!v) return;
    try { safeSet(videoSeenKey(), "1"); } catch (e) {}
    window.open(`https://www.youtube.com/watch?v=${v.yt}`, "_blank", "noopener");
}

async function saveTutorials(list, okMsg) {
    return updateSettings({ tutorials: cleanTutorials(list) }, okMsg);
}

function editTutorial(idEnc) {
    const id = idEnc ? unarg(idEnc) : null;
    const list = tutorials().map(v => ({ ...v }));
    const cur = id ? list.find(v => v.id === id) : null;
    const m = openModalHtml(`
        <h3 class="text-xl font-black mb-1">🎥 ${cur ? "تعديل فيديو" : "إضافة فيديو"}</h3>
        <p class="text-xs text-slate-500 mb-4">الصق لينك يوتيوب — ينفع يكون "غير مدرج" (Unlisted)</p>
        <form id="vidForm" class="space-y-3">
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1.5">لينك يوتيوب</label>
                <input id="vidUrl" required class="input ltr text-sm" placeholder="https://youtu.be/...">
                <div id="vidPrev" class="mt-2"></div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1.5">العنوان</label>
                <input id="vidTitle" required maxlength="80" class="input" placeholder="مثلاً: شرح الموقع كامل">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1.5">الفيديو ده عن</label>
                <select id="vidTool" class="input">
                    <option value="">🌐 الموقع كله</option>
                    <option value="yazeed">🟣 يزيد</option>
                    <option value="tayeb">⚡ الطيب</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1.5">ملاحظة (اختياري)</label>
                <textarea id="vidNote" rows="2" maxlength="300" class="input text-sm" placeholder="مثلاً: اتفرّج عليه قبل أول تسليمة"></textarea>
            </div>
            <label class="flex items-center gap-2 font-bold text-sm cursor-pointer">
                <input id="vidPin" type="checkbox" class="w-4 h-4 accent-yellow-500"> ⭐ ده أول فيديو (يظهر للموظف الجديد أول ما يدخل)
            </label>
            <div class="flex gap-3 pt-2">
                <button type="button" data-act="cancel" class="flex-1 py-3 rounded-2xl bg-slate-100 dark:bg-white/10 font-bold">إلغاء</button>
                <button id="vidSave" class="flex-1 py-3 rounded-2xl bg-red-600 text-white font-black">حفظ</button>
            </div>
        </form>`);
    const prev = () => {
        const yid = ytId(m.querySelector("#vidUrl").value);
        m.querySelector("#vidPrev").innerHTML = yid
            ? `<img src="${ytThumb(yid)}" alt="" class="w-full rounded-2xl" style="aspect-ratio:16/9;object-fit:cover">`
            : (m.querySelector("#vidUrl").value.trim() ? `<p class="text-xs font-black text-red-500">اللينك ده مش لينك يوتيوب</p>` : "");
    };
    m.querySelector("#vidUrl").value = cur ? `https://youtu.be/${cur.yt}` : "";
    m.querySelector("#vidTitle").value = cur?.title || "";
    m.querySelector("#vidTool").value = cur?.tool || "";
    m.querySelector("#vidNote").value = cur?.note || "";
    m.querySelector("#vidPin").checked = cur ? cur.pinned : !list.length;
    m.querySelector("#vidUrl").oninput = prev;
    prev();
    setTimeout(() => m.querySelector(cur ? "#vidTitle" : "#vidUrl")?.focus(), 60);
    m.querySelector('[data-act="cancel"]').onclick = () => closeTopModal(true);
    m.querySelector("#vidForm").onsubmit = async e => {
        e.preventDefault();
        const yt = ytId(m.querySelector("#vidUrl").value);
        const title = m.querySelector("#vidTitle").value.trim();
        if (!yt) return toast("الصق لينك يوتيوب صح", "warning");
        if (!title) return toast("اكتب عنوان للفيديو", "warning");
        const pinned = m.querySelector("#vidPin").checked;
        const item = { id: cur?.id || Math.random().toString(36).slice(2, 10), title, yt, tool: m.querySelector("#vidTool").value, note: m.querySelector("#vidNote").value.trim(), pinned };
        let next = cur ? list.map(v => v.id === cur.id ? item : v) : [...list, item];
        if (pinned) next = next.map(v => ({ ...v, pinned: v.id === item.id }));
        const btn = m.querySelector("#vidSave");
        setLoading(btn, "جاري الحفظ...");
        const ok = await saveTutorials(next, "✅ اتحفظ الفيديو");
        if (ok) closeTopModal(true);
        else { btn.disabled = false; btn.textContent = "حفظ"; }
    };
}

function pinTutorial(idEnc) {
    const id = unarg(idEnc);
    saveTutorials(tutorials().map(v => ({ ...v, pinned: v.id === id })), "⭐ بقى أول فيديو");
}

function deleteTutorial(idEnc) {
    const id = unarg(idEnc);
    const v = tutorials().find(x => x.id === id);
    if (!v) return;
    confirmDialog({
        title: "مسح الفيديو", icon: "🗑️", text: `${v.title}\nهيختفي من عند الموظفين (مش هيتمسح من يوتيوب).`,
        confirmText: "مسح", confirmClass: "bg-red-600 text-white",
        onConfirm: () => {
            if (S.videoPlaying === id) S.videoPlaying = null;
            return saveTutorials(tutorials().filter(x => x.id !== id), "اتمسح الفيديو 🗑️");
        }
    });
}

/* أول مرة الموظف يدخل: نعرض عليه الفيديو ⭐ */
function videoSeenKey() { return "dz_video_seen_" + (S.user?.id || ""); }

function maybeShowWelcomeVideo() {
    if (S.me?.role !== "worker") return;
    const first = tutorials().find(v => v.pinned);

/* =========================================================
   🏆 الترتيب
   - النهاردة: يوم الشغل من 6 الصبح
   - الأسبوع: كل الشغل اللي لسه ماتدفعش (بيتصفّر لما الأونر يقفّل)
   - الموظف: أول 3 + ترتيبه — الأونر: الكل
========================================================= */

S.lb = { period: "day", day: 0, tool: "", data: { day: [], week: [] }, loading: false, error: "", loaded: false };

async function lbFetch(period, day, tool) {
    const { data, error } = await db.rpc("dz_leaderboard", { p_period: period, p_tool: tool || null, p_days_ago: day || 0 });
    if (error) throw error;
    return data || [];
}

async function loadLeaderboard() {
    S.lb.loading = true;
    try {
        if (isOwner()) {
            S.lb.data[S.lb.period] = await lbFetch(S.lb.period, S.lb.period === "day" ? S.lb.day : 0, S.lb.tool);
        } else {
            const [d, w] = await Promise.all([lbFetch("day", 0, ""), lbFetch("week", 0, "")]);
            S.lb.data.day = d; S.lb.data.week = w;
        }
        S.lb.error = "";
    } catch (e) {
        S.lb.error = e?.message || "error";
    }
    S.lb.loading = false;
}

function lbRefresh() {
    loadLeaderboard().then(() => { if (parseRoute().name === "leaderboard" && !modalStack.length) mountPage(renderLeaderboard()); });
}
function lbSet(key, val) { S.lb[key] = val; lbRefresh(); }

const lbNum = v => Number(v).toLocaleString("en");
const MEDALS = ["🥇", "🥈", "🥉"];

function lbRowHtml(r, rows) {
    const top = r.rank <= 3;
    const max = Math.max(1, ...rows.map(x => Number(x.valid_total)));
    const pct = Math.round(Number(r.valid_total) / max * 100);
    const name = isOwner() ? workerLink(r.worker_id) : `<span class="font-black">${esc(r.display_name)}</span>`;
    return `
    <div class="relative overflow-hidden rounded-2xl border ${r.is_me ? "border-purple-500 bg-purple-500/10" : top ? "border-yellow-500/30 bg-yellow-500/5" : "border-slate-200 dark:border-white/10 bg-white dark:bg-white/[.03]"} p-3.5">
        <div class="absolute inset-y-0 right-0 ${top ? "bg-yellow-400/15" : "bg-slate-400/10"}" style="width:${pct}%"></div>
        <div class="relative flex items-center gap-3">
            <div class="w-11 h-11 shrink-0 rounded-2xl flex items-center justify-center font-black ${top ? "text-2xl" : "bg-slate-100 dark:bg-white/10 text-sm num"}">${MEDALS[r.rank - 1] || r.rank}</div>
            <div class="flex-1 min-w-0">
                <p class="truncate">${name} ${r.is_me ? `<span class="ms-1 px-2 py-0.5 rounded-full bg-purple-600 text-white text-[10px] font-black">إنت</span>` : ""}</p>
                <p class="text-[11px] text-slate-500 num">${r.subs_count} تسليمة</p>
            </div>
            <div class="text-end">
                <p class="text-xl font-black text-emerald-500 num">${lbNum(r.valid_total)}</p>
                <p class="text-[10px] text-slate-500 font-bold">Valid</p>
            </div>
        </div>
    </div>`;
}

function podiumHtml(rows) {
    const p = rows.filter(r => r.rank <= 3);
    if (!p.length) return "";
    const order = [p.find(r => r.rank === 2), p.find(r => r.rank === 1), p.find(r => r.rank === 3)].filter(Boolean);
    const h = { 1: "h-28", 2: "h-20", 3: "h-16" };
    const bar = { 1: "from-yellow-600 to-yellow-400", 2: "from-slate-500 to-slate-300", 3: "from-orange-700 to-orange-400" };
    return `
    <div class="flex items-end justify-center gap-3 md:gap-6 pt-2">${order.map(r => `
        <div class="flex flex-col items-center w-24 md:w-32">
            <div class="text-3xl md:text-4xl mb-1">${MEDALS[r.rank - 1]}</div>
            <p class="font-black text-sm truncate max-w-full ${r.is_me ? "text-purple-500" : ""}">${esc(r.display_name)}${r.is_me ? " (إنت)" : ""}</p>
            <p class="text-xs font-black text-emerald-500 num mb-2">${lbNum(r.valid_total)}</p>
            <div class="w-full ${h[r.rank]} rounded-t-2xl bg-gradient-to-t ${bar[r.rank]} flex items-start justify-center pt-2 text-white font-black text-xl shadow-lg">${r.rank}</div>
        </div>`).join("")}
    </div>`;
}

function myRankLine(rows) {
    const me = rows.find(r => r.is_me);
    if (!me) return `<p class="mt-4 text-center text-sm font-bold text-slate-500">لسه ماسلّمتش — يلا 🚀</p>`;
    if (me.rank <= 3) return `<p class="mt-4 text-center text-sm font-black text-purple-500">🔥 إنت في التوب 3 — كمّل!</p>`;
    const third = rows.find(r => r.rank === 3);
    const gap = third ? Number(third.valid_total) - Number(me.valid_total) + 1 : 0;
    return `
    <div class="mt-4 rounded-2xl border border-purple-500/40 bg-purple-500/10 p-3 flex items-center justify-between gap-3">
        <span class="font-black">ترتيبك: <span class="num">#${me.rank}</span></span>
        <span class="text-sm"><b class="text-emerald-500 num">${lbNum(me.valid_total)}</b> Valid${gap > 0 ? ` · فاضلك <b class="num">${lbNum(gap)}</b> وتدخل التوب 3` : ""}</span>
    </div>`;
}

function workerBoardCard(title, sub, rows) {
    return `
    <div class="card p-5 md:p-6">
        <h3 class="text-lg font-black">${title}</h3>
        <p class="text-xs text-slate-500 mb-4">${sub}</p>
        ${rows.length ? podiumHtml(rows) : `<div class="py-8 text-center text-slate-500 font-bold">🏁 لسه محدش سلّم</div>`}
        ${myRankLine(rows)}
    </div>`;
}

function renderLeaderboard() {
    const hero = `
    <div class="rounded-3xl p-6 md:p-8 mb-6 text-white bg-gradient-to-br from-yellow-500 via-amber-500 to-orange-600 shadow-xl relative overflow-hidden">
        <div class="absolute -left-4 -top-6 text-[120px] opacity-20 leading-none select-none">🏆</div>
        <p class="text-white/85 font-bold">DARK ZONE</p>
        <h1 class="text-3xl md:text-4xl font-black mt-1">أعلى المسلّمين</h1>
        <p class="text-white/85 text-sm mt-2">بالـ Valid · المستني والمقبول بس</p>
    </div>`;
    if (S.lb.error) return hero + `<div class="card p-6 text-center"><p class="font-black">الترتيب لسه مش متفعل</p><p class="text-xs text-red-500 ltr mt-2">${esc(S.lb.error)}</p></div>`;

    if (!isOwner()) {
        return `${hero}
        <div class="grid lg:grid-cols-2 gap-5">
            ${workerBoardCard("🔥 أعلى 3 النهاردة", "يوم الشغل بيبدأ 6 الصبح", S.lb.data.day)}
            ${workerBoardCard("👑 أعلى 3 الأسبوع ده", "من آخر تقفيل لحد دلوقتي", S.lb.data.week)}
        </div>`;
    }

    const rows = S.lb.data[S.lb.period] || [];
    const chip = (key, val, label) => `<button type="button" onclick="lbSet('${key}', ${typeof val === "string" ? `'${val}'` : val})" class="chip ${S.lb[key] === val ? "chip-active" : "chip-idle"}">${label}</button>`;
    const dayChip = (d, label) => `<button type="button" onclick="S.lb.period='day'; lbSet('day', ${d})" class="chip ${S.lb.period === "day" && S.lb.day === d ? "chip-active" : "chip-idle"}">${label}</button>`;
    return `${hero}
    <div class="flex flex-wrap gap-2 mb-5">
        ${dayChip(0, "📅 النهاردة")}${dayChip(1, "⏪ امبارح")}
        <button type="button" onclick="lbSet('period','week')" class="chip ${S.lb.period === "week" ? "chip-active" : "chip-idle"}">👑 الأسبوع (لسه ماتقفّلش)</button>
        <span class="w-px bg-slate-200 dark:bg-white/10 mx-1"></span>
        ${chip("tool", "", "🌍 الكل")}${chip("tool", "yazeed", "🟣 يزيد")}${chip("tool", "tayeb", "⚡ الطيب")}
    </div>
    ${!rows.length ? emptyBox(S.lb.loading ? "جاري التحميل..." : "لسه محدش سلّم", "🏁") : `
    <div class="card p-5 md:p-6 mb-5">${podiumHtml(rows)}</div>
    <div class="space-y-2">${rows.map(r => lbRowHtml(r, rows)).join("")}</div>`}`;
}

const LB_PAGE = {
    render: () => {
        if (!S.lb.loaded) { S.lb.loaded = true; lbRefresh(); }
        return renderLeaderboard();
    },
    live: lbRefresh
};

PAGES.owner.leaderboard = LB_PAGE;

    "الرقم في الصورة مختلف": "The number in the image is different",
    "الـ Valid اللي في صورة الاتشيكر مش": "The Valid in the checker image isn't",
    "برجاء التأكد من الرقم اللي كتبته وجرّب تاني": "Please check the number you entered and try again",
    "الـ AI مقدرش يقرا الرقم من الصورة": "AI couldn't read the number from the image",
    "الإدارة هتراجعها بنفسها": "the admin will review it manually"
};

const AR_RUN = /[؀-ۿ](?:[؀-ۿً-ٟ\s\.،؟]*[؀-ۿً-ٟ؟])?/g;
const HAS_AR = /[؀-ۿ]/;
const EN_MAP = new Map(Object.entries(EN).map(([k, v]) => [k.replace(/\s+/g, " ").trim(), v]));

function translateRun(run) {
    const norm = run.replace(/\s+/g, " ").trim();
    if (EN_MAP.has(norm)) return EN_MAP.get(norm);
    // ترجمة كلمة بكلمة بأطول جملة متاحة في القاموس
    const words = norm.split(" ");
    const out = [];
    let i = 0;
    while (i < words.length) {
        let found = false;
        for (let len = Math.min(10, words.length - i); len > 0; len--) {
            const phrase = words.slice(i, i + len).join(" ");
            if (EN_MAP.has(phrase)) { out.push(EN_MAP.get(phrase)); i += len; found = true; break; }
        }
        if (!found) { out.push(words[i]); i++; }
    }
    return out.filter(Boolean).join(" ");
}

function translateText(str) {
    return HAS_AR.test(str) ? str.replace(AR_RUN, translateRun) : str;
}

function skipNode(el) {
    return !el || el.closest?.("[data-noi18n], script, style, textarea");
}

function translateTree(root) {
    if (lang !== "en" || !root) return;
    if (root.nodeType === 3) {
        if (!skipNode(root.parentElement) && HAS_AR.test(root.nodeValue)) {
            const t = translateText(root.nodeValue);
            if (t !== root.nodeValue) root.nodeValue = t;
        }
        return;
    }
    if (root.nodeType !== 1 || skipNode(root)) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let n;
    const nodes = [];
    while ((n = walker.nextNode())) nodes.push(n);
    nodes.forEach(node => {
        if (skipNode(node.parentElement) || !HAS_AR.test(node.nodeValue)) return;
        const t = translateText(node.nodeValue);
        if (t !== node.nodeValue) node.nodeValue = t;
    });
    [root, ...root.querySelectorAll("[placeholder],[title]")].forEach(el => {
        if (skipNode(el)) return;
        ["placeholder", "title"].forEach(a => {
            const v = el.getAttribute?.(a);
            if (v && HAS_AR.test(v)) el.setAttribute(a, translateText(v));
        });
    });
    if (root === document.body) document.title = translateText(document.title);
}

const i18nObserver = new MutationObserver(muts => {
    if (lang !== "en") return;
    muts.forEach(m => {
        if (m.type === "characterData") translateTree(m.target);
        else m.addedNodes.forEach(translateTree);
    });
});

function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
    document.querySelectorAll(".langBtn").forEach(b => { b.textContent = lang === "en" ? "عربي" : "EN"; });
    if (lang === "en") {
        translateTree(document.body);
        i18nObserver.observe(document.body, { childList: true, subtree: true, characterData: true });
    }
}

function toggleLanguage() {
    if (lang === "en") {
        // الرجوع للعربي: نحمّل الصفحة من جديد (الجلسة بتفضل محفوظة)
        safeSet("elbob_language", "ar");
        location.reload();
        return;
    }
    lang = "en";
    safeSet("elbob_language", "en");
    applyLang();
    if (S.me) renderRoute(); // نعيد رسم الصفحة بالتواريخ والعملة بالإنجليزي
}

document.addEventListener("DOMContentLoaded", applyLang);
</script>
</body>
